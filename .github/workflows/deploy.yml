name: Auto Deploy to Production

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force Docker Rebuild (--build)?'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy and Verify Health
    runs-on: self-hosted
    steps:
      - name: Pull latest code (clean mirror)
        id: pull_code
        run: |
          cd /home/essam/querybloom
          PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "HEAD")
          git fetch origin prod
          git checkout prod
          git reset --hard origin/prod
          NEW_COMMIT=$(git rev-parse HEAD)
          echo "prev_commit=$PREV_COMMIT" >> $GITHUB_OUTPUT
          echo "new_commit=$NEW_COMMIT" >> $GITHUB_OUTPUT

      - name: Check if rebuild is needed
        id: check_rebuild
        run: |
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "Manual force rebuild requested."
            echo "rebuild=true" >> $GITHUB_OUTPUT
          else
            cd /home/essam/querybloom
            PREV="${{ steps.pull_code.outputs.prev_commit }}"
            NEW="${{ steps.pull_code.outputs.new_commit }}"
            
            if [ "$PREV" != "$NEW" ]; then
              CHANGED=$(git diff --name-only $PREV $NEW | grep -E '(Dockerfile|docker-compose|uv\.lock|pyproject\.toml|package.*\.json|start\.sh)' || true)
              if [ -n "$CHANGED" ]; then
                echo "Detected dependency or Dockerfile changes: $CHANGED"
                echo "rebuild=true" >> $GITHUB_OUTPUT
              else
                echo "Only application code changed. No full container rebuild required."
                echo "rebuild=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "rebuild=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Ensure container is running or rebuild if needed
        run: |
          cd /home/essam/querybloom
          REBUILD="${{ steps.check_rebuild.outputs.rebuild }}"
          
          if [ "$REBUILD" = "true" ]; then
            echo "Rebuilding and starting querybloom-prod..."
            docker compose up -d --build querybloom-prod
          else
            # Ensure container is running if it was stopped
            if [ -z "$(docker ps -q -f name=querybloom-prod)" ]; then
              echo "Container was stopped. Starting querybloom-prod..."
              docker compose up -d querybloom-prod
            fi
          fi

      - name: Rebuild Frontend Bundle if webapp files changed
        run: |
          cd /home/essam/querybloom
          PREV="${{ steps.pull_code.outputs.prev_commit }}"
          NEW="${{ steps.pull_code.outputs.new_commit }}"
          REBUILD="${{ steps.check_rebuild.outputs.rebuild }}"
          
          # If container was not just fully rebuilt, recompile webapp build inside container
          if [ "$REBUILD" != "true" ]; then
            if [ "$PREV" != "$NEW" ] && git diff --name-only $PREV $NEW | grep -q '^webapp/'; then
              echo "Frontend source files changed. Rebuilding SvelteKit static bundle with zero downtime..."
              docker exec querybloom-prod sh -c "cd /workspace/querybloom/webapp && rm -rf build_tmp .svelte-kit && BUILD_DIR=build_tmp BASE_PATH=/querybloom npm run build && rm -rf build_old && (mv build build_old || true) && mv build_tmp build && rm -rf build_old"
            fi
          fi

      - name: Verify Backend & Show Logs
        run: |
          echo "Waiting for backend and frontend to be ready..."
          MAX_RETRIES=20
          RETRY_COUNT=0
          HTTP_STATUS="000"
          FRONTEND_STATUS="000"
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8002/api/v1/health || echo "000")
            FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8002/ || echo "000")
            if [ "$HTTP_STATUS" = "200" ] && [ "$FRONTEND_STATUS" = "200" ]; then
              echo "Application is ready! (HTTP 200 OK after ${RETRY_COUNT} retries)"
              break
            fi
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: API status is $HTTP_STATUS, Frontend is $FRONTEND_STATUS, waiting 2s..."
            sleep 2
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done
          
          echo "====================== CONTAINER LOGS ======================"
          docker logs --tail 40 querybloom-prod || true
          echo "============================================================"
          
          if [ "$HTTP_STATUS" != "200" ] || [ "$FRONTEND_STATUS" != "200" ]; then
            echo "::error::❌ Health check failed! API: $HTTP_STATUS, Frontend: $FRONTEND_STATUS"
            exit 1
          fi
          
          echo "✅ Deployment successful! Health status: 200 OK"
