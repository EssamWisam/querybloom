answer(answer="I ran a query that, for each sgul:S2Cell_Level13 cell, finds locations the cell is connected to (psss:connectedTo), finds sites contained in those locations (sgul:sfContains with rdf:type ius:Site), counts distinct sites per cell, and returns the top 20 cells by site count. Top 20 results (cell IRI — siteCount) returned by the query: 1. sgulr:s2.level13.9758960523159797760 — 3 2. sgulr:s2.level13.5965661247171985408 — 3 3. sgulr:s2.level13.5965661281531723776 — 3 4. sgulr:s2.level13.5969398281036365824 — 2 5. sgulr:s2.level13.9768683573203697664 — 2 6. (remaining entries include cells with siteCount = 2 or 1) ... 20. sgulr:s2.level13.9766516332706136064 — 1 Notes: - The query returns the actual cell IRIs (as shown) and the site counts. Some cells have an rdfs:label but many do not (labels shown as nan in the query output); if you want readable labels for cells and locations, we can expand the query to include labels for the connected locations and/or for the sites. - If you want the full list with site IRIs (not just counts) or to break counts down by location, I can modify the query accordingly.", kg="sockg", sparql="PREFIX sgul: <http://stko-kwg.geog.ucsb.edu/lod/ontology/> PREFIX psss: <http://purl.org/spatialai/spatial/spatial-full#> PREFIX ius: <https://idir.uta.edu/sockg-ontology#> PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#> SELECT ?cell (COUNT(DISTINCT ?site) AS ?siteCount) (SAMPLE(?cellLabel) AS ?cellLabel) WHERE { ?cell a sgul:S2Cell_Level13 . OPTIONAL { ?cell rdfs:label ?cellLabel } ?cell psss:connectedTo ?loc . ?loc a ius:Location . ?loc sgul:sfContains ?site . ?site a ius:Site . } GROUP BY ?cell ORDER BY DESC(?siteCount) LIMIT 20") 0.000s
