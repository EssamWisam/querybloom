Now I'll run a SPARQL query to count, for each S2 level-13 cell, the number of distinct sites that are contained in locations the cell is connected to. I'll group by the cell and order by site count descending, limiting to top 20.

execute_query(query="PREFIX sgul: <http://stko-kwg.geog.ucsb.edu/lod/ontology/> PREFIX psss: <http://purl.org/spatialai/spatial/spatial-full#> PREFIX ius: <https://idir.uta.edu/sockg-ontology#> PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#> SELECT ?cell (COUNT(DISTINCT ?site) AS ?siteCount) (SAMPLE(?cellLabel) AS ?cellLabel) WHERE { ?cell a sgul:S2Cell_Level13 . OPTIONAL { ?cell rdfs:label ?cellLabel } ?cell psss:connectedTo ?loc . ?loc a ius:Location . ?loc sgul:sfContains ?site . ?site a ius:Site . } GROUP BY ?cell ORDER BY DESC(?siteCount) LIMIT 20") 0.033s
