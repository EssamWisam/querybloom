PREFIX psss: <http://purl.org/spatialai/spatial/spatial-full#>
PREFIX ius: <https://idir.uta.edu/sockg-ontology#>
PREFIX sgul: <http://stko-kwg.geog.ucsb.edu/lod/ontology/>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
SELECT ?cell ( COUNT( DISTINCT ?site ) AS ?siteCount ) ( SAMPLE( ?cellLabel ) AS ?cellLabel ) WHERE {
  ?cell a sgul:S2Cell_Level13 .
  OPTIONAL {
    ?cell rdfs:label ?cellLabel
  }
  ?cell psss:connectedTo ?loc .
  ?loc a ius:Location .
  ?loc sgul:sfContains ?site .
  ?site a ius:Site .
}
GROUP BY ?cell
ORDER BY DESC ( ?siteCount )
LIMIT 20
Ground Truth SPARQL
PREFIX sockg: <https://idir.uta.edu/sockg-ontology#>
PREFIX kwg: <http://stko-kwg.geog.ucsb.edu/lod/ontology/>
PREFIX saw: <http://purl.org/spatialai/spatial/spatial-full#>
PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>

SELECT ?cell (COUNT(DISTINCT ?site) AS ?siteCount)
WHERE {
  ?cell a kwg:S2Cell_Level13 ;
        saw:connectedTo ?location .
  ?location a sockg:Location ;
            kwg:sfContains ?site .
  ?site a sockg:Site .
}
GROUP BY ?cell
HAVING (COUNT(DISTINCT ?site) > 0)
ORDER BY DESC(?siteCount)
LIMIT 20
