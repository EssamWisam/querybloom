<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Bloom Pipeline</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --border-color: #333;
            --accent-color: #2563eb;
            --card-bg: #fff;
            --phase-label-bg: #fff;
            --phase-border: #e5e7eb;
            --arrow-color: #4b5563;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        /* Phase Styling */
        .phase-container {
            position: relative;
            padding: 40px 16px 20px 16px;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            background: #f8fafc;
        }

        .phase-container.phase-2 {
            background: #f0fdf4;
            border-color: #86efac;
        }

        .phase-label {
            position: absolute;
            top: -18px;
            left: 30px;
            background: var(--phase-label-bg);
            padding: 5px 15px;
            font-size: 18px;
            font-weight: 800;
            color: #475569;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .phase-2 .phase-label {
            color: #166534;
            border-color: #86efac;
        }

        /* Flow Layout */
        .steps-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
        }

        .steps-grid-3 {
            display: grid;
            grid-template-columns: auto 1fr auto 1fr auto;
            align-items: center;
            width: 100%;
            row-gap: 10px;
        }

        .steps-grid-4 {
            display: grid;
            grid-template-columns: auto 1fr auto 1fr auto 1fr auto;
            align-items: center;
            width: 100%;
            row-gap: 10px;
        }

        .grid-arrow {
            display: flex;
            align-items: center;
            min-width: 20px;
            margin-top: -30px;
        }

        .grid-arrow::before {
            content: '';
            flex: 1;
            height: 0;
            border-top: 2px solid var(--arrow-color);
        }

        .grid-arrow::after {
            content: '';
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 10px solid var(--arrow-color);
        }

        .grid-arrow-left {
            display: flex;
            align-items: center;
            min-width: 20px;
            margin-top: -30px;
            flex-direction: row-reverse;
        }

        .grid-arrow-left::before {
            content: '';
            flex: 1;
            height: 0;
            border-top: 2px solid var(--arrow-color);
        }

        .grid-arrow-left::after {
            content: '';
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-right: 10px solid var(--arrow-color);
        }

        .grid-arrow-down {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding-right: 80px;
            font-size: 0;
            line-height: 0;
            color: transparent;
            margin: -4px 0;
        }

        .grid-arrow-down::before {
            content: '';
            width: 0;
            height: 16px;
            border-left: 2px solid var(--arrow-color);
            margin-right: 6px;
        }

        .grid-arrow-down::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 10px solid var(--arrow-color);
        }

        .grid-arrow-double {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
            min-width: 30px;
            margin-top: -30px;
        }

        .double-arrow-r,
        .double-arrow-l {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .double-arrow-l {
            flex-direction: row-reverse;
        }

        .double-arrow-r::before,
        .double-arrow-l::before {
            content: '';
            flex: 1;
            height: 0;
            border-top: 2px solid var(--arrow-color);
        }

        .double-arrow-r::after {
            content: '';
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 10px solid var(--arrow-color);
        }

        .double-arrow-l::after {
            content: '';
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-right: 10px solid var(--arrow-color);
        }

        /* Feedback / Light Arrows */
        .arrow-light::before {
            border-color: #94a3b8 !important;
        }

        .double-arrow-r.arrow-light::after {
            border-left-color: #94a3b8 !important;
        }

        .double-arrow-l.arrow-light::after {
            border-right-color: #94a3b8 !important;
        }

        .steps-extra-row {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        /* Card / Figure Style */
        .figure-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 200px;
            /* Bigger width */
            flex-shrink: 0;
        }

        .visual-block {
            width: 200px;
            height: 160px;
            /* Bigger height */
            background: #ffffff;
            border: 2px dashed #94a3b8;
            /* Dashed block around graph */
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .visual-block:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--accent-color);
        }

        .phase-2 .visual-block {
            border-color: #4ade80;
        }

        .figure-title {
            font-size: 14px;
            /* Title below */
            font-weight: 700;
            text-align: center;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Arrows */
        .arrow-right {
            align-self: center;
            color: var(--arrow-color);
            font-size: 24px;
            margin-top: -30px;
            /* Align visually with center of block */
        }

        .arrow-down-large {
            font-size: 40px;
            color: var(--arrow-color);
            margin: -20px 0;
        }

        /* SVG Internal Styles */
        svg {
            overflow: visible;
        }

        .node-rect {
            fill: #f1f5f9;
            stroke: #334155;
            stroke-width: 1.5;
            rx: 4;
        }

        .node-circle {
            fill: #eff6ff;
            stroke: #2563eb;
            stroke-width: 2;
        }

        .edge-path {
            fill: none;
            stroke: #64748b;
            stroke-width: 1.5;
            marker-end: url(#arrowhead);
        }

        .text-label {
            font-family: monospace;
            font-size: 10px;
            fill: #334155;
            text-anchor: middle;
            font-weight: bold;
        }

        .edge-label {
            font-family: monospace;
            font-size: 9px;
            fill: #64748b;
            text-anchor: middle;
            background: white;
        }

        /* Specific Phase 2 colors */
        .p2-node {
            fill: #f0fdf4;
            stroke: #16a34a;
        }

        .p2-edge {
            stroke: #16a34a;
        }

        /* Step 2 specific styles for table */
        .table-rect {
            fill: #fff;
            stroke: #94a3b8;
            stroke-width: 1;
        }

        .table-header {
            fill: #f1f5f9;
        }

        .table-text {
            font-family: monospace;
            font-size: 9px;
            fill: #475569;
        }


        /* Evolution View - Multi-Agent Distiller */
        .evo-container {
            position: relative;
            padding: 50px 40px 40px;
            border: 2px dashed #86efac;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            background: #f0fdf4;
        }

        .evo-section-divider {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: #166534;
            letter-spacing: 0.5px;
            margin: 28px 0 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .evo-section-divider::before,
        .evo-section-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #86efac;
        }

        .mad-entry-arrow {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin: 18px 0 8px;
        }

        .mad-entry-line {
            width: 1.5px;
            height: 22px;
            background: #93c5fd;
        }

        .mad-entry-label {
            font-size: 9px;
            font-weight: 600;
            color: #2563eb;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .evo-stages {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 0;
            margin-bottom: 24px;
        }

        .evo-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 130px;
        }

        .evo-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 13px;
            color: white;
        }

        .evo-stage-name {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .evo-stage-detail {
            font-size: 10px;
            color: #64748b;
            text-align: center;
            max-width: 150px;
            line-height: 1.3;
        }

        .evo-connector {
            display: flex;
            align-items: center;
            padding: 0 2px;
            margin-top: -18px;
        }

        .evo-connector-line {
            width: 32px;
            height: 0;
            border-top: 2px solid #cbd5e1;
        }

        .evo-connector-tip {
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 7px solid #cbd5e1;
        }

        .evo-body {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 14px;
        }

        .evo-pair {
            width: 100%;
            border-radius: 10px;
            border: 1.5px solid;
            overflow: hidden;
        }

        .evo-pair-header {
            padding: 7px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .evo-pair-initial {
            border-color: #93c5fd;
        }

        .evo-pair-initial .evo-pair-header {
            background: #dbeafe;
            color: #1e40af;
        }

        .evo-pair-complexity {
            border-color: #fde68a;
        }

        .evo-pair-complexity .evo-pair-header {
            background: #fef3c7;
            color: #92400e;
        }

        .evo-pair-verify {
            border-color: #86efac;
        }

        .evo-pair-verify .evo-pair-header {
            background: #dcfce7;
            color: #166534;
        }

        .evo-verify-row {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        .evo-bidir-arrows {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }

        .evo-execute-block {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            background: #f8fafc;
            font-size: 10px;
            font-weight: 600;
            color: #475569;
            white-space: nowrap;
        }

        .evo-execute-block svg {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
        }

        .evo-horiz-arrow {
            color: #94a3b8;
            font-size: 16px;
            flex-shrink: 0;
        }

        .evo-pair-reword {
            border-color: #d8b4fe;
        }

        .evo-pair-reword .evo-pair-header {
            background: #ede9fe;
            color: #5b21b6;
        }

        .evo-pair-final {
            border-color: #86efac;
        }

        .evo-pair-final .evo-pair-header {
            background: #dcfce7;
            color: #166534;
        }

        .evo-pair-question {
            padding: 10px 16px 6px;
            font-size: 13px;
            line-height: 1.5;
            color: #1e293b;
        }

        .evo-pair-question .q-label {
            font-weight: 800;
            color: #2563eb;
            margin-right: 4px;
        }

        .evo-pair-sparql {
            margin: 0 16px 12px;
            background: #1e293b;
            border-radius: 6px;
            overflow: hidden;
        }

        .evo-code-bar {
            display: flex;
            gap: 5px;
            padding: 6px 10px 0;
        }

        .evo-code-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .evo-pair-sparql pre {
            margin: 0;
            padding: 6px 12px 10px;
            font-family: 'SF Mono', Menlo, monospace;
            font-size: 11.5px;
            line-height: 1.55;
            color: #94a3b8;
            white-space: pre-wrap;
        }

        .evo-pair-sparql .kw {
            color: #38bdf8;
        }

        .evo-pair-sparql .hl {
            color: #fbbf24;
            font-weight: 700;
        }

        .evo-transforms {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .evo-transform {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 18px;
            font-size: 11.5px;
            font-weight: 600;
            border: 1.5px solid;
        }

        .evo-tf-num {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
        }

        .evo-flow-arrow {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .evo-agent-icon {
            margin-right: 5px;
            display: inline-flex;
            vertical-align: -2px;
        }

        .evo-agent-icon svg {
            width: 14px;
            height: 14px;
        }

        .evo-status-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 1px 8px;
            border-radius: 10px;
            background: #dcfce7;
            color: #166534;
            font-size: 9px;
            font-weight: 700;
            border: 1px solid #86efac;
            text-transform: none;
            letter-spacing: 0;
        }

        .evo-verify-flow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .evo-loop-label {
            font-size: 11px;
            color: #16a34a;
            font-weight: 600;
        }

        .evo-verify-note {
            padding: 4px 16px 10px;
            font-size: 10px;
            color: #64748b;
        }

        .evo-reword-note {
            padding: 4px 16px 10px;
            font-size: 10px;
            color: #7c3aed;
            font-style: italic;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .visual-block {
                box-shadow: none !important;
            }

            .visual-block:hover {
                transform: none;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

    <!-- SVG Definitions for markers -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
        <defs>
            <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
            </marker>
            <marker id="arrowhead-small" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4"
                orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
            </marker>
            <marker id="arrowhead-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
                orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
            </marker>
            <marker id="arrowhead-green-small" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4"
                orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
            </marker>
            <marker id="arrowhead-blue-small" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4"
                orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
            </marker>
        </defs>
    </svg>

    <div id="app" class="container"></div>

    <script>
        // =====================================================================
        //  SVG PRIMITIVE HELPERS
        //  Reusable building blocks for constructing SVG diagrams.
        //  To add a new step, define its svg() using these helpers + raw SVG.
        // =====================================================================

        /** Wrap content in an <svg> element with matching viewBox. */
        const svgEl = (w, h, content) =>
            `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${content}</svg>`;

        /**
         * Labeled rectangle node.
         * Text is auto-centered: textY = y + round(h/2) + 4.
         * Pass label=null to render only the rect (e.g. attribute boxes).
         *
         * opts: { style, textFill, fontSize, cls, attrs }
         */
        const node = (x, y, w, h, label, opts = {}) => {
            const { style = '', textFill = '', fontSize = '', cls = 'node-rect', attrs = '' } = opts;
            const textY = y + Math.round(h / 2) + 4;
            let html = `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${cls}"`;
            if (style) html += ` style="${style}"`;
            if (attrs) html += ` ${attrs}`;
            html += ' />';
            if (label) {
                html += `<text x="${x + w / 2}" y="${textY}" class="text-label"`;
                if (textFill) html += ` fill="${textFill}"`;
                if (fontSize) html += ` style="font-size:${fontSize}"`;
                html += `>${label}</text>`;
            }
            return html;
        };

        /** SVG <path> element, defaults to class="edge-path" (with arrowhead marker). */
        const pathEl = (d, { cls = 'edge-path', style = '', attrs = '' } = {}) => {
            let html = `<path d="${d}"`;
            if (cls) html += ` class="${cls}"`;
            if (style) html += ` style="${style}"`;
            if (attrs) html += ` ${attrs}`;
            html += ' />';
            return html;
        };

        /** Simple line from (x1,y1)→(x2,y2). No CSS class, no arrowhead. */
        const line = (x1, y1, x2, y2, stroke = '#64748b', sw = null, attrs = '') => {
            let html = `<path d="M${x1} ${y1} L${x2} ${y2}" fill="none" stroke="${stroke}"`;
            if (sw !== null) html += ` stroke-width="${sw}"`;
            if (attrs) html += ` ${attrs}`;
            html += ' />';
            return html;
        };

        /** Text label inside SVG. */
        const label = (x, y, text, { cls = 'text-label', fill = '', fontSize = '', attrs = '' } = {}) => {
            let html = `<text x="${x}" y="${y}" class="${cls}"`;
            if (fill) html += ` fill="${fill}"`;
            if (fontSize) html += ` font-size="${fontSize}"`;
            if (attrs) html += ` ${attrs}`;
            html += `>${text}</text>`;
            return html;
        };

        /** Small edge label (monospace, gray). */
        const edgeLabel = (x, y, text) =>
            `<text x="${x}" y="${y}" class="edge-label">${text}</text>`;

        /** Small numbered circle (white bg, colored border). */
        const numCircle = (x, y, num, color = '#64748b', opts = {}) => {
            const { radius = 5.5, fontSize = 7, textY = 2.5, strokeWidth = 1 } = opts;
            return `<g transform="translate(${x}, ${y})">
            <circle cx="0" cy="0" r="${radius}" fill="white" stroke="${color}" stroke-width="${strokeWidth}" />
            <text x="0" y="${textY}" text-anchor="middle" font-size="${fontSize}" font-weight="900" fill="${color}">${num}</text>
        </g>`;
        };

        // =====================================================================
        //  COMPOSITE SVG COMPONENTS
        // =====================================================================


        const triplePattern = (tx, ty, leftLabel, rightLabel, edgeLbl) =>
            `<g transform="translate(${tx}, ${ty})">
            ${node(0, 0, 40, 20, leftLabel)}
            ${node(80, 0, 40, 20, rightLabel)}
            ${pathEl('M40 10 L80 10')}
            ${edgeLabel(60, 8, edgeLbl)}
        </g>`;

        /**
         * Mini triple (no labels, smaller boxes) for the adjacency index table.
         * To add more rows, add another miniTriple() at a new (tx, ty).
         */
        const miniTriple = (tx, ty, opts = {}) => {
            const { rectStyle = '' } = opts;
            return `<g transform="translate(${tx}, ${ty})">
            <rect x="0" y="0" width="25" height="12" class="node-rect" stroke-width="1" ${rectStyle ? `style="${rectStyle}"` : ''} />
            <path d="M25 6 L45 6" class="edge-path" stroke-width="1" />
            <rect x="45" y="0" width="25" height="12" class="node-rect" stroke-width="1" ${rectStyle ? `style="${rectStyle}"` : ''} />
        </g>`;
        };

        // =====================================================================
        //  LAYOUT HELPERS
        // =====================================================================

        /** Figure card: visual-block wrapper + title underneath. */
        const figureCard = (title, svgContent, { cardStyle = '', blockStyle = '', titleStyle = '' } = {}) =>
            `<div class="figure-card"${cardStyle ? ` style="${cardStyle}"` : ''}>
            <div class="visual-block"${blockStyle ? ` style="${blockStyle}"` : ''}>
                ${svgContent}
            </div>
            <div class="figure-title"${titleStyle ? ` style="${titleStyle}"` : ''}>${title}</div>
        </div>`;

        /** Right-pointing arrow between steps. */
        const arrowRight = (style = '') =>
            `<div class="arrow-right"${style ? ` style="${style}"` : ''}>➜</div>`;

        /** Down-pointing arrow between phases. */
        const arrowDown = () =>

                const gal = '<div class="grid-arrow-left"></div>';
                // Row 1 double arrow (3<->4): Forward is Right (row1[2]->row1[3]), Feedback is Left (row1[3]->row1[2])
                const gad1 = '<div class="grid-arrow-double"><div class="double-arrow-l arrow-light"></div><div class="double-arrow-r"></div></div>';
                // Row 2 double arrow (7<->8): Forward is Left (row2[1]->row2[0]), Feedback is Right (row2[0]->row2[1])
                const gad2 = '<div class="grid-arrow-double"><div class="double-arrow-l"></div><div class="double-arrow-r arrow-light"></div></div>';

                const row1 = steps.slice(0, 4).map(s => figureCard(s.title, s.svg(), s));
                const row2 = steps.slice(4, 8).map(s => figureCard(s.title, s.svg(), s)).reverse();
                const gridHTML = [
                    row1[0], ga, row1[1], ga, row1[2], gad1, row1[3],
                    '<div class="grid-arrow-down">⬇</div>',
                    row2[0], gad2, row2[1], gal, row2[2], gal, row2[3]
                ].join('\n');

                content = `<div class="steps-grid-4">${gridHTML}</div>`;

            } else {
                content = steps.map((step, i) => {
                    const card = figureCard(step.title, step.svg(), step);
                    return i < steps.length - 1 ? card + arrowRight(arrowStyle) : card;
                }).join('\n');
            }

            return `<div class="phase-container ${className}">
            <div class="phase-label">${phaseLabel}</div>
            <div class="steps-row"${rowStyle ? ` style="${rowStyle}"` : ''}>
                ${content}
            </div>
        </div>`;
