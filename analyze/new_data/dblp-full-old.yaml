  text: "Who has coauthored articles with Mohammad Arif Ul Alam in EAI Endorsed Transactions on Ubiquitous Environments, how many such articles did each person coauthor with him, and how many articles in total has each person authored in that journal? Order the results by the shared-article count in descending order, then by the total journal-article count in descending order, and finally alphabetically by coauthor name."
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX journals: <https://dblp.org/streams/journals/>

    SELECT ?coauthor ?coauthorName ?sharedArticleCount ?totalJournalArticleCount
    WHERE {
      {
        SELECT ?coauthor (COUNT(DISTINCT ?article) AS ?sharedArticleCount)
        WHERE {
          ?alamSignature dblp:signatureCreator <https://dblp.org/pid/136/4531> ;
                         dblp:signaturePublication ?article .
          ?article dblp:publishedInStream journals:ue .
          ?coauthorSignature dblp:signaturePublication ?article ;
                             dblp:signatureCreator ?coauthor .
          FILTER(?coauthor != <https://dblp.org/pid/136/4531>)
        }
        GROUP BY ?coauthor
      }
      {
        SELECT ?coauthor (COUNT(DISTINCT ?journalArticle) AS ?totalJournalArticleCount)
        WHERE {
          ?journalSignature dblp:signatureCreator ?coauthor ;
                            dblp:signaturePublication ?journalArticle .
          ?journalArticle dblp:publishedInStream journals:ue .
        }
        GROUP BY ?coauthor
      }
      ?coauthor dblp:primaryCreatorName ?coauthorName .
    }
    ORDER BY DESC(?sharedArticleCount) DESC(?totalJournalArticleCount) ?coauthorName
