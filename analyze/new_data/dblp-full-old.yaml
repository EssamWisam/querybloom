  text: "How many papers are in the ISSTA 2024 proceedings edited by Maria Christakis, how many have an OpenCitations Meta identifier, how many do not, and what percentage have one?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>

    SELECT ?paperCount ?withOmidCount
           ((?paperCount - ?withOmidCount) AS ?withoutOmidCount)
           ((100.0 * ?withOmidCount / ?paperCount) AS ?omidCoveragePercent)
    WHERE {
      {
        SELECT (COUNT(DISTINCT ?paper) AS ?paperCount)
               (COUNT(DISTINCT ?paperWithOmid) AS ?withOmidCount)
        WHERE {
          ?proceedings a dblp:Editorship ;
                       dblp:title ?proceedingsTitle ;
                       dblp:createdBy ?editor .
          ?editor a dblp:Person ;
                  dblp:primaryCreatorName ?editorName .
          ?paper a dblp:Inproceedings ;
                 dblp:publishedAsPartOf ?proceedings .
          OPTIONAL {
            ?paper dblp:omid ?omid .
            BIND(?paper AS ?paperWithOmid)
          }
          FILTER(STR(?proceedingsTitle) = "Proceedings of the 33rd ACM SIGSOFT International Symposium on Software Testing and Analysis, ISSTA 2024, Vienna, Austria, September 16-20, 2024")
          FILTER(STR(?editorName) = "Maria Christakis")
        }
      }
    }
