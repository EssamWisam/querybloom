  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>

    SELECT DISTINCT ?authorName ?orcid ?primaryAffiliation ?paperCount
    WHERE {
      {
        SELECT ?author (COUNT(DISTINCT ?publication) AS ?paperCount)
