- id: 71
  src_id: 20
  text: "Which researchers authored the greatest number of conference papers appearing in proceedings volumes they also edited, how many such papers did each researcher author, and which Wikidata or Wikipedia profile links are available for them?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>

    SELECT DISTINCT ?researcher ?researcherName ?paperCount ?externalProfile
    WHERE {
      {
        SELECT ?researcher (COUNT(DISTINCT ?paper) AS ?paperCount)
        WHERE {
          ?paper a dblp:Inproceedings ;
                 dblp:authoredBy ?researcher ;
                 dblp:publishedAsPartOf ?proceedings .
          ?proceedings a dblp:Editorship ;
                       dblp:editedBy ?researcher .
        }
        GROUP BY ?researcher
      }
      {
        SELECT (MAX(?candidateCount) AS ?maxCount)
        WHERE {
          {
            SELECT ?candidate (COUNT(DISTINCT ?candidatePaper) AS ?candidateCount)
            WHERE {
              ?candidatePaper a dblp:Inproceedings ;
                              dblp:authoredBy ?candidate ;
                              dblp:publishedAsPartOf ?candidateProceedings .
              ?candidateProceedings a dblp:Editorship ;
                                    dblp:editedBy ?candidate .
            }
            GROUP BY ?candidate
          }
        }
      }

      ?researcher dblp:primaryCreatorName ?researcherName .
      FILTER(?paperCount = ?maxCount)

      OPTIONAL {
        { ?researcher dblp:wikidata ?externalProfile . }
        UNION
        { ?researcher dblp:wikipedia ?externalProfile . }
      }
    }
    ORDER BY ?researcherName
  llm_best: true
