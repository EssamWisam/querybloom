  text: "Among the LNI edited volumes containing entries in Ausgezeichnete Informatikdissertationen and having at least two distinct contributing authors, which five have the most distinct authors, and what are each volume’s number, publication year, number of distinct contributions, and number of distinct authors?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>

    SELECT ?editedVolume ?volumeNumber ?volumeYear
           (COUNT(DISTINCT ?contribution) AS ?contributionCount)
           (COUNT(DISTINCT ?person) AS ?authorCount)
    WHERE {
      ?editedVolume a dblp:Editorship ;
                    dblp:publishedInSeries "LNI" ;
                    dblp:publishedInSeriesVolume ?volumeNumber ;
                    dblp:yearOfPublication ?volumeYear .
      ?contribution a dblp:Incollection ;
                    dblp:publishedInBook "Ausgezeichnete Informatikdissertationen" ;
                    dblp:publishedAsPartOf ?editedVolume .
      ?signature a dblp:AuthorSignature ;
                 dblp:signaturePublication ?contribution ;
                 dblp:signatureCreator ?person .
      ?person a dblp:Person .
    }
    GROUP BY ?editedVolume ?volumeNumber ?volumeYear
    HAVING (COUNT(DISTINCT ?person) >= 2)
    ORDER BY DESC(?authorCount)
    LIMIT 5
  llm_best: true
