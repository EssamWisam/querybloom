- id: 1
  src_id: 1
  text: "What conference papers has Yue Lu authored from 2018 onward, and what are their publication years and, where recorded, their titles, venues, page ranges, and listed author counts?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX person: <https://dblp.org/pid/74/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT DISTINCT ?paper ?title ?year ?venue ?pages ?authorCount
    WHERE {
      ?paper a dblp:Inproceedings ;
             dblp:authoredBy person:6493 ;
             dblp:yearOfPublication ?year .
      FILTER (xsd:integer(STR(?year)) >= 2018)
      OPTIONAL { ?paper dblp:title ?title . }
      OPTIONAL { ?paper dblp:publishedIn ?venue . }
      OPTIONAL { ?paper dblp:pagination ?pages . }
      OPTIONAL { ?paper dblp:numberOfCreators ?authorCount . }
    }
    ORDER BY ?year ?title
  llm_best: true
  result_count: 33
  result_snippet: |
    paper: https://dblp.org/rec/conf/apccas/LuKL18 | title: A Bit-Serial Variable-Accuracy FFT Processor For Energy-Harvesting Systems. | year: 2018 | venue: APCCAS | pages: 299-304 | authorCount: 3
    paper: https://dblp.org/rec/conf/fdl/LuDK18 | title: A New Ageing-Aware Approach Via Path Isolation. | year: 2018 | venue: FDL | pages: 5-16 | authorCount: 3
    paper: https://dblp.org/rec/conf/momm/TianLLY18 | title: Betweenness Centrality Based k-Anonymity for Privacy Preserving in Social Networks. | year: 2018 | venue: MoMM | pages: 3-7 | authorCount: 4
