- id: 3
  src_id: 1
  text: "At which venue or venues did Yue Lu publish the greatest number of conference papers, and how many did Yue Lu publish at each?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX person: <https://dblp.org/pid/74/>

    SELECT ?venue ?paperCount
    WHERE {
      {
        SELECT ?venue (COUNT(DISTINCT ?paper) AS ?paperCount)
        WHERE {
          ?paper a dblp:Inproceedings ;
                 dblp:authoredBy person:6493 ;
                 dblp:publishedIn ?venue .
        }
        GROUP BY ?venue
      }
      {
        SELECT (MAX(?countForVenue) AS ?maxCount)
        WHERE {
          {
            SELECT ?venueForMax (COUNT(DISTINCT ?paperForMax) AS ?countForVenue)
            WHERE {
              ?paperForMax a dblp:Inproceedings ;
                           dblp:authoredBy person:6493 ;
                           dblp:publishedIn ?venueForMax .
            }
            GROUP BY ?venueForMax
          }
        }
      }
      FILTER (?paperCount = ?maxCount)
    }
    ORDER BY ?venue
  llm_best: ""
  result_count: 4
  result_snippet: |
    venue: ICDAR | paperCount: 3
    venue: KSEM (2) | paperCount: 3
    venue: PDCAT | paperCount: 3
