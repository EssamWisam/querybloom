  text: "Considering only researchers with at least two conference papers published in proceedings they also edited, which 10 have the most such papers? When counts are tied, order the researchers alphabetically by preferred name and then by researcher identifier; for each researcher, what are the preferred name, paper count, and any recorded primary affiliations?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>

    SELECT ?researcher ?researcherName ?paperCount ?primaryAffiliation
    WHERE {
      {
        SELECT ?researcher ?researcherName
               (COUNT(DISTINCT ?paper) AS ?paperCount)
        WHERE {
          ?proceedings a dblp:Editorship ;
                       dblp:editedBy ?researcher .

          ?paper a dblp:Inproceedings ;
                 dblp:publishedAsPartOf ?proceedings .

          FILTER EXISTS {
            ?paper dblp:authoredBy ?researcher .
          }

          ?researcher a dblp:Person ;
                      dblp:primaryCreatorName ?researcherName .
        }
        GROUP BY ?researcher ?researcherName
        HAVING (COUNT(DISTINCT ?paper) >= 2)
        ORDER BY DESC(?paperCount)
                 LCASE(STR(?researcherName))
                 STR(?researcher)
        LIMIT 10
      }

      OPTIONAL {
        ?researcher dblp:primaryAffiliation ?primaryAffiliation .
      }
    }
    ORDER BY DESC(?paperCount)
             LCASE(STR(?researcherName))
             STR(?researcher)
             STR(?primaryAffiliation)
