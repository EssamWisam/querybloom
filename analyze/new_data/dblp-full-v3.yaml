  text: "Considering proceedings volumes that record a publication year, publisher, and ISBN, who are Vincent Ng’s five most frequent co-editors, how many such volumes did he share with each, and what were each shared volume’s publication year, publisher, and ISBN?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX bibtex: <http://purl.org/net/nknouf/ns/bibtex#>

    SELECT DISTINCT ?coEditor ?coEditorName ?sharedVolumeCount
                    ?proceedings ?year ?publisher ?isbn
    WHERE {
      {
        SELECT ?coEditor (COUNT(DISTINCT ?sharedProceedings) AS ?sharedVolumeCount)
        WHERE {
          ?sharedProceedings a dblp:Editorship ;
                             dblp:bibtexType bibtex:Proceedings ;
                             dblp:editedBy <https://dblp.org/pid/67/3142> ;
                             dblp:editedBy ?coEditor ;
                             dblp:yearOfPublication ?countedYear ;
                             dblp:publishedBy ?countedPublisher ;
                             dblp:isbn ?countedIsbn .
          FILTER (?coEditor != <https://dblp.org/pid/67/3142>)
        }
        GROUP BY ?coEditor
        ORDER BY DESC(?sharedVolumeCount)
        LIMIT 5
      }

      ?coEditor dblp:primaryCreatorName ?coEditorName .
      ?proceedings a dblp:Editorship ;
                   dblp:bibtexType bibtex:Proceedings ;
                   dblp:editedBy <https://dblp.org/pid/67/3142> ;
                   dblp:editedBy ?coEditor ;
                   dblp:yearOfPublication ?year ;
                   dblp:publishedBy ?publisher ;
                   dblp:isbn ?isbn .
    }
    ORDER BY DESC(?sharedVolumeCount) ?coEditorName ?year ?proceedings
