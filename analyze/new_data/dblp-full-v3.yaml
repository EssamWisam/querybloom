    WHERE {
      ?paper a dblp:Inproceedings ;
             dblp:title "Spatial-Angular Decoupling Interaction Networks for Light Field Angular Super-Resolution." ;
             dblp:yearOfEvent ?eventYear ;
             dblp:yearOfPublication ?publicationYear ;
             dblp:publishedAsPartOf ?proceedings .
      BIND(
        xsd:integer(STR(?publicationYear)) - xsd:integer(STR(?eventYear))
        AS ?yearsElapsed
      )
      {
        SELECT ?proceedings (MAX(?candidateDelay) AS ?maximumProceedingsDelay)
        WHERE {
          ?candidatePaper a dblp:Inproceedings ;
                          dblp:publishedAsPartOf ?proceedings ;
                          dblp:yearOfEvent ?candidateEventYear ;
                          dblp:yearOfPublication ?candidatePublicationYear .
          BIND(
            xsd:integer(STR(?candidatePublicationYear)) - xsd:integer(STR(?candidateEventYear))
            AS ?candidateDelay
          )
        }
        GROUP BY ?proceedings
      }
    }
