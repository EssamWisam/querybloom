  text: "Which five proceedings editors have the highest counts of distinct conference papers with at least one ambiguously identified author across their Springer-published proceedings volumes, and what is each editor’s paper count? List them in descending order by paper count."
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

    SELECT ?editor (SAMPLE(?name) AS ?editorName) (COUNT(DISTINCT ?paper) AS ?paperCount)
    WHERE {
      ?editor rdf:type dblp:Person .
      OPTIONAL { ?editor rdfs:label ?name . }
      ?proceedings rdf:type dblp:Editorship ;
                   dblp:createdBy ?editor ;
                   dblp:publishedBy ?publisher .
      FILTER(?publisher = "Springer")
      ?paper rdf:type dblp:Inproceedings ;
             dblp:publishedAsPartOf ?proceedings ;
             dblp:authoredBy ?ambiguousAuthor .
      ?ambiguousAuthor rdf:type dblp:AmbiguousCreator .
    }
    GROUP BY ?editor
    ORDER BY DESC(?paperCount)
    LIMIT 5
