  text: "Which editors of the 2012 IFTC proceedings “Advances on Digital Television and Wireless Multimedia Communications” also authored at least one APCCAS paper, and what were the proceedings’ publisher, series, series volume, and ISBN?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX iftc: <https://dblp.org/rec/conf/iftc/>

    SELECT DISTINCT ?editorName ?publisher ?series ?seriesVolume ?isbn
    WHERE {
      iftc:2012 a dblp:Editorship ;
          dblp:yearOfPublication ?year ;
          dblp:editedBy ?editor ;
          dblp:publishedBy ?publisher ;
          dblp:publishedInSeries ?series ;
          dblp:publishedInSeriesVolume ?seriesVolume ;
          dblp:isbn ?isbn .
      ?editor dblp:primaryCreatorName ?editorName .

      FILTER(STR(?year) = "2012")
      FILTER EXISTS {
        ?apccasPaper a dblp:Inproceedings ;
            dblp:authoredBy ?editor ;
            dblp:publishedIn "APCCAS" .
      }
    }
