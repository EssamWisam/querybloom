- id: 64
  src_id: 13
  text: "Which ten authors with a recorded name, ORCID, and primary affiliation have published the most distinct articles in Applicable Algebra in Engineering, Communication and Computing? Rank them by descending article count, breaking ties by ascending DBLP author identifier. For each author, could you provide their DBLP identifier, name, article count, ORCID, primary affiliation, all their articles in the journal, and each article’s issue when available, with the detailed results ordered by descending article count, then ascending author name and article identifier?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX journal: <https://dblp.org/streams/journals/>

    SELECT DISTINCT ?author ?authorName ?orcid ?primaryAffiliation
                    ?articleCount ?article ?issue
    WHERE {
      {
        SELECT ?author (COUNT(DISTINCT ?countedArticle) AS ?articleCount)
        WHERE {
          ?countedSignature dblp:signatureCreator ?author ;
                            dblp:signaturePublication ?countedArticle .
          ?author dblp:orcid ?eligibilityOrcid ;
                  dblp:primaryAffiliation ?eligibilityAffiliation .
          FILTER EXISTS { ?author dblp:primaryCreatorName ?eligibilityName . }
          ?countedArticle dblp:publishedInStream journal:aaecc .
        }
        GROUP BY ?author
        ORDER BY DESC(?articleCount) ?author
        LIMIT 10
      }
      ?signature dblp:signatureCreator ?author ;
                 dblp:signaturePublication ?article .
      ?author dblp:primaryCreatorName ?authorName ;
              dblp:orcid ?orcid ;
              dblp:primaryAffiliation ?primaryAffiliation .
      ?article dblp:publishedInStream journal:aaecc .
      OPTIONAL { ?article dblp:publishedInJournalVolumeIssue ?issue . }
    }
    ORDER BY DESC(?articleCount) ?authorName ?article
