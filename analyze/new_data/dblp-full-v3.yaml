- id: 1
  src_id: 1
  text: "Of the following three papers—“An ultra-low-power variable-accuracy bit-serial FFT butterfly processing element for IoT sensors,” “A Bit-Serial Variable-Accuracy FFT Processor For Energy-Harvesting Systems,” and “Skywork-daVinci: A Novel CPSS-based Painting Support System”—which had the most authors? For that paper, report its author count, the average author count across all three papers, and the amount by which its author count exceeded the average."
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX apccas: <https://dblp.org/rec/conf/apccas/>
    PREFIX case: <https://dblp.org/rec/conf/case/>

    SELECT ?title ?authorCount ?averageAuthorCount
           (?authorCount - ?averageAuthorCount AS ?authorsAboveAverage)
    WHERE {
      VALUES ?paper {
        apccas:LuK16
        apccas:LuKL18
        case:GuoBL0XW020
      }
      ?paper a dblp:Inproceedings ;
          dblp:title ?title ;
          dblp:numberOfCreators ?authorCount .

      {
        SELECT (AVG(?candidateAuthorCount) AS ?averageAuthorCount)
        WHERE {
          VALUES ?candidatePaper {
            apccas:LuK16
            apccas:LuKL18
            case:GuoBL0XW020
          }
          ?candidatePaper a dblp:Inproceedings ;
              dblp:numberOfCreators ?candidateAuthorCount .
        }
      }
    }
    ORDER BY DESC(?authorCount)
    LIMIT 1
  llm_best: ""
  result_count: 1
  result_snippet: |
    title: Skywork-daVinci: A Novel CPSS-based Painting Support System. | authorCount: 7 | averageAuthorCount: 4.0 | authorsAboveAverage: 3.0
