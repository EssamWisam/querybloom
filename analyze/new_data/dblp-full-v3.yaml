            ?paper dblp:authoredBy ?author .
            ?author a dblp:Person ;
                    dblp:creatorName ?authorName ;
                    dblp:orcid ?orcid .
          }
        }
        GROUP BY ?paper ?recordedNumberOfCreators
      }
