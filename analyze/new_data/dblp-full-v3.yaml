  text: "For “Workshop Organizers' Message.” (DOI 10.1007/978-3-642-04205-8_9), how many distinct named authors have ORCID identifiers, what is the paper’s recorded total number of creators, and what is the absolute difference between those two counts?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
