  text: "Among papers that appeared in proceedings edited by at least one of their own authors, which paper or papers have the greatest recorded number of authors, how many authors do they have, which authors also served as proceedings editors, and what is each paper’s DOI, if available, with the results ordered by paper title and author-editor name?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>

    SELECT DISTINCT ?title ?creatorCount ?authorEditorName ?doi
    WHERE {
      ?paper a dblp:Inproceedings ;
             dblp:title ?title ;
             dblp:numberOfCreators ?creatorCount ;
             dblp:authoredBy ?authorEditor ;
             dblp:publishedAsPartOf ?proceedings .

      ?proceedings a dblp:Editorship ;
                   dblp:editedBy ?authorEditor .

      ?authorEditor dblp:creatorName ?authorEditorName .

      OPTIONAL {
        ?paper dblp:doi ?doi .
      }

      {
        SELECT (MAX(?candidateCount) AS ?maximumCreatorCount)
        WHERE {
          ?candidatePaper a dblp:Inproceedings ;
                          dblp:numberOfCreators ?candidateCount ;
                          dblp:authoredBy ?candidateAuthorEditor ;
                          dblp:publishedAsPartOf ?candidateProceedings .

          ?candidateProceedings a dblp:Editorship ;
                                dblp:editedBy ?candidateAuthorEditor .
        }
      }

      FILTER(?creatorCount = ?maximumCreatorCount)
    }
    ORDER BY ?title ?authorEditorName
  llm_best: ""
  result_count: 2
  result_snippet: |
    title: SoccerNet 2022 Challenges Results. | creatorCount: 94 | authorEditorName: Thomas B. Moeslund | doi: https://doi.org/10.1145/3552437.3558545
    title: SoccerNet 2022 Challenges Results. | creatorCount: 94 | authorEditorName: Thomas Baltzer Moeslund | doi: https://doi.org/10.1145/3552437.3558545
