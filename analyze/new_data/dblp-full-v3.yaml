  text: "Which authors wrote the 2016 contribution or contributions to Ausgezeichnete Informatikdissertationen whose page ranges begin with the highest page number, what are those page ranges, and what affiliations, if any, are recorded for the authors?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT DISTINCT ?author ?pagination ?affiliation
    WHERE {
      ?signature dblp:signatureCreator ?author ;
                 dblp:signaturePublication ?contribution .
      ?contribution dblp:publishedInBook "Ausgezeichnete Informatikdissertationen" ;
                    dblp:yearOfPublication "2016"^^xsd:gYear ;
                    dblp:pagination ?pagination .
      BIND(xsd:integer(STRBEFORE(STR(?pagination), "-")) AS ?firstPage)

      {
        SELECT (MAX(?candidateFirstPage) AS ?highestFirstPage)
        WHERE {
          ?candidateSignature dblp:signatureCreator ?candidateAuthor ;
                              dblp:signaturePublication ?candidateContribution .
          ?candidateContribution dblp:publishedInBook "Ausgezeichnete Informatikdissertationen" ;
                                 dblp:yearOfPublication "2016"^^xsd:gYear ;
                                 dblp:pagination ?candidatePagination .
          BIND(xsd:integer(STRBEFORE(STR(?candidatePagination), "-")) AS ?candidateFirstPage)
        }
      }

      FILTER(?firstPage = ?highestFirstPage)
      OPTIONAL { ?author dblp:affiliation ?affiliation . }
    }
