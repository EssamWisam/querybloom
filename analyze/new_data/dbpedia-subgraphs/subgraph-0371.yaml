      California: '(city^=''Anaheim, CaliforniaAnaheim'', colwidth^=''20'', has abstract^=''( 캘리포니아는 여기로 연결됩니다. 다른 뜻에 대해서는 캘리포니아 (동음이의) 문서를 참고하십시오.) 캘리포니아주(영어: State of California)는 미국의 서부에 있는 주로, 미국의 서부 해안선의 반 정도를 차지하고 있다. 현재 주지사는 개빈 뉴섬이다. 인구는 4천만 명에 육박해 미국에서 가장 인구가 많은 주이며, 주요 대도시로는 로스앤젤레스,...'')'
