- id: 1
  src_id: 1
  text: "Which conference papers authored by Yue Lu have a recorded DOI, a page range, and at least three listed authors? For each paper, give its title, publication year, venue, page range, DOI, and number of authors."
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX dblpPerson: <https://dblp.org/pid/74/>

    SELECT DISTINCT ?title ?year ?venue ?pageRange ?doi ?authorCount
    WHERE {
      ?paper a dblp:Inproceedings ;
             dblp:authoredBy dblpPerson:6493 ;
             dblp:title ?title ;
             dblp:yearOfPublication ?year ;
             dblp:publishedIn ?venue ;
             dblp:pagination ?pageRange ;
             dblp:doi ?doi ;
             dblp:numberOfCreators ?authorCount .
      FILTER(?authorCount >= 3)
    }
    ORDER BY ?year ?title
  llm_best: ""
  result_count: 52
  result_snippet: |
