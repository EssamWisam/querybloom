                       dblp:yearOfPublication ?rankedYear ;
                       dblp:publishedIn ?rankedVenue .
          FILTER(xsd:integer(STR(?rankedYear)) > 2020)
        }
        GROUP BY ?author ?authorName
        ORDER BY DESC(?paperCount) ?authorName
        LIMIT 3
