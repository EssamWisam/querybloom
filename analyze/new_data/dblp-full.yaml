- id: 10
  src_id: 3
  text: "Which LNI volume of Ausgezeichnete Informatikdissertationen contains the greatest number of contributions, and how many does it contain?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>

    SELECT DISTINCT ?volume ?lniVolume ?contributionCount
    WHERE {
      {
        SELECT ?volume (COUNT(DISTINCT ?contribution) AS ?contributionCount)
        WHERE {
          ?contribution dblp:publishedInBook "Ausgezeichnete Informatikdissertationen" ;
                        dblp:publishedAsPartOf ?volume .
          ?volume dblp:publishedInSeries "LNI" .
        }
        GROUP BY ?volume
      }

      ?volume dblp:publishedInSeriesVolume ?lniVolume .

      {
        SELECT (MAX(?candidateCount) AS ?maximumCount)
        WHERE {
          {
            SELECT ?candidateVolume (COUNT(DISTINCT ?candidateContribution) AS ?candidateCount)
            WHERE {
              ?candidateContribution dblp:publishedInBook "Ausgezeichnete Informatikdissertationen" ;
                                     dblp:publishedAsPartOf ?candidateVolume .
              ?candidateVolume dblp:publishedInSeries "LNI" .
            }
            GROUP BY ?candidateVolume
          }
        }
      }

      FILTER(?contributionCount = ?maximumCount)
    }
  llm_best: true
  result_count: 1
  result_snippet: |
    volume: https://dblp.org/rec/conf/gi/2015diss | lniVolume: D-16 | contributionCount: 38
