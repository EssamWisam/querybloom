- id: 3
  src_id: 1
  text: "At which of APCCAS and CASE did Yue Lu publish more papers? Give the conference name, number of papers, and earliest and latest recorded publication years."
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX dblpPerson: <https://dblp.org/pid/74/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT ?venue
           (COUNT(DISTINCT ?paper) AS ?numberOfPapers)
           (MIN(?yearNumber) AS ?earliestYear)
           (MAX(?yearNumber) AS ?latestYear)
    WHERE {
      ?paper a dblp:Inproceedings ;
             dblp:authoredBy dblpPerson:6493 .
      {
        ?paper dblp:publishedIn "APCCAS" .
        BIND("APCCAS" AS ?venue)
      }
      UNION
      {
        ?paper dblp:publishedIn "CASE" .
        BIND("CASE" AS ?venue)
      }
      OPTIONAL {
        ?paper dblp:yearOfPublication ?year .
        BIND(xsd:integer(STR(?year)) AS ?yearNumber)
      }
    }
    GROUP BY ?venue
    ORDER BY DESC(COUNT(DISTINCT ?paper))
    LIMIT 1
  llm_best: true
  result_count: 1
  result_snippet: |
    venue: APCCAS | numberOfPapers: 2 | earliestYear: 2016 | latestYear: 2018
- id: 4
  src_id: 1
  text: "Which CASE papers authored by Yue Lu had the most authors? For every paper tied for the maximum, give its title, publication year, and number of authors."
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX dblpPerson: <https://dblp.org/pid/74/>

    SELECT DISTINCT ?title ?year ?largestAuthorCount
    WHERE {
      {
        SELECT (MAX(?authorCount) AS ?largestAuthorCount)
        WHERE {
          ?candidate a dblp:Inproceedings ;
                     dblp:authoredBy dblpPerson:6493 ;
                     dblp:numberOfCreators ?authorCount ;
                     dblp:publishedIn ?candidateVenue .
          FILTER(?candidateVenue = "CASE")
        }
      }
      ?paper a dblp:Inproceedings ;
             dblp:authoredBy dblpPerson:6493 ;
             dblp:numberOfCreators ?largestAuthorCount ;
             dblp:title ?title ;
             dblp:yearOfPublication ?year ;
             dblp:publishedIn ?venue .
      FILTER(?venue = "CASE")
    }
    ORDER BY ?title
