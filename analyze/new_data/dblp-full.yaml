    title: A Polynomial Time Solvable Formulation of Multiple Sequence Alignment. | year: 2005 | venue: RECOMB | pageRange: 204-216 | doi: https://doi.org/10.1007/11415770_16 | authorCount: 3
    title: A Hybrid Recognition Scheme Based on Partially Labeled SOM and MLP. | year: 2006 | venue: ICPR (2) | pageRange: 800-803 | doi: https://doi.org/10.1109/ICPR.2006.85 | authorCount: 3
- id: 2
  src_id: 1
  text: "Which proceedings volumes did Yue Lu edit in 2012? For each, give the title and any recorded publisher, series name, series volume, ISBN, and links to its document page or to the same publication elsewhere?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX dblpPerson: <https://dblp.org/pid/74/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX owl: <http://www.w3.org/2002/07/owl#>
    PREFIX bibtex: <http://purl.org/net/nknouf/ns/bibtex#>

    SELECT DISTINCT ?title ?publisher ?series ?seriesVolume ?isbn ?accessLink
    WHERE {
      ?proceedings a dblp:Editorship ;
                   dblp:bibtexType bibtex:Proceedings ;
                   dblp:editedBy dblpPerson:6493 ;
                   dblp:yearOfPublication "2012"^^xsd:gYear ;
                   dblp:title ?title .
      OPTIONAL { ?proceedings dblp:publishedBy ?publisher . }
      OPTIONAL { ?proceedings dblp:publishedInSeries ?series . }
      OPTIONAL { ?proceedings dblp:publishedInSeriesVolume ?seriesVolume . }
      OPTIONAL { ?proceedings dblp:isbn ?isbn . }
      OPTIONAL {
        { ?proceedings dblp:documentPage ?accessLink . }
        UNION
        { ?proceedings owl:sameAs ?accessLink . }
      }
    }
    ORDER BY ?title
  llm_best: ""
