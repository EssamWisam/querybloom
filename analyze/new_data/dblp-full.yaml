- id: 32
  src_id: 8
  text: "Among PRICAI conference papers with at least one author signature, which unresolved author name or names appear on the most distinct papers, and on how many papers does each appear?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>

    SELECT ?unresolvedAuthorName ?paperCount
    WHERE {
      {
        SELECT ?unresolvedAuthorName (COUNT(DISTINCT ?paper) AS ?paperCount)
        WHERE {
          ?paper a dblp:Inproceedings ;
                 dblp:publishedInBook ?venue ;
                 dblp:createdBy ?unresolvedAuthor .
          ?unresolvedAuthor a dblp:AmbiguousCreator ;
                            dblp:primaryCreatorName ?unresolvedAuthorName .

          FILTER(STRSTARTS(STR(?venue), "PRICAI"))
          FILTER EXISTS {
            ?signature a dblp:AuthorSignature ;
                       dblp:signaturePublication ?paper .
          }
        }
        GROUP BY ?unresolvedAuthorName
      }
      {
        SELECT (MAX(?candidateCount) AS ?maximumCount)
        WHERE {
          {
            SELECT ?candidateName (COUNT(DISTINCT ?candidatePaper) AS ?candidateCount)
            WHERE {
              ?candidatePaper a dblp:Inproceedings ;
                              dblp:publishedInBook ?candidateVenue ;
                              dblp:createdBy ?candidateUnresolvedAuthor .
              ?candidateUnresolvedAuthor a dblp:AmbiguousCreator ;
                                         dblp:primaryCreatorName ?candidateName .

              FILTER(STRSTARTS(STR(?candidateVenue), "PRICAI"))
              FILTER EXISTS {
                ?candidateSignature a dblp:AuthorSignature ;
                                    dblp:signaturePublication ?candidatePaper .
              }
            }
            GROUP BY ?candidateName
          }
        }
      }
      FILTER(?paperCount = ?maximumCount)
    }
    ORDER BY ?unresolvedAuthorName
