- id: 5
  src_id: 2
  text: "Which volumes edited by Yue Lu in 2012 have a recorded title, publication series, ISBN, and at least one DOI URL listed as an equivalent link, document page, or primary document page, and what are those details and the distinct DOI URLs for each volume?"
  query: |
    PREFIX dblp: <https://dblp.org/rdf/schema#>
    PREFIX person: <https://dblp.org/pid/74/>
    PREFIX owl: <http://www.w3.org/2002/07/owl#>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT ?volume ?title ?series ?isbn
           (GROUP_CONCAT(DISTINCT STR(?doi); SEPARATOR=", ") AS ?doiLinks)
    WHERE {
      ?volume a dblp:Editorship ;
              dblp:editedBy person:6493 ;
              dblp:title ?title ;
              dblp:publishedInSeries ?series ;
              dblp:yearOfPublication "2012"^^xsd:gYear ;
              dblp:isbn ?isbn .
      ?volume (owl:sameAs|dblp:documentPage|dblp:primaryDocumentPage) ?doi .
      FILTER(
        STRSTARTS(STR(?doi), "https://doi.org/") ||
        STRSTARTS(STR(?doi), "http://dx.doi.org/")
      )
    }
    GROUP BY ?volume ?title ?series ?isbn
    ORDER BY ?title
