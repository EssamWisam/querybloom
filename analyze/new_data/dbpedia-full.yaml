- id: 321
  src_id: 89
  text: "Which stations in the Philippines, other than Antipolo station, share Antipolo station’s government-agency owner but have a corporate owner different from Antipolo station’s? For each station, identify its corporate owner and state how many stations in this set that company owns."
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX dbr: <http://dbpedia.org/resource/>

    SELECT DISTINCT ?station ?company ?companyStationCount
    WHERE {
      {
        SELECT ?governmentAgency ?antipoloCompany ?company
               (COUNT(DISTINCT ?countedStation) AS ?companyStationCount)
        WHERE {
          dbr:Antipolo_station dbo:owner ?governmentAgency ;
                                 dbp:owned ?antipoloCompany .

          ?countedStation a dbo:Station ;
                          dbo:owner ?governmentAgency ;
                          dbp:owned ?company ;
                          dbp:country dbr:Philippines .

          ?governmentAgency a dbo:GovernmentAgency .
          ?company a dbo:Company .

          FILTER (?countedStation != dbr:Antipolo_station)
          FILTER (?company != ?antipoloCompany)
        }
        GROUP BY ?governmentAgency ?antipoloCompany ?company
      }

      ?station a dbo:Station ;
               dbo:owner ?governmentAgency ;
               dbp:owned ?company ;
               dbp:country dbr:Philippines .

      FILTER (?station != dbr:Antipolo_station)
    }
  llm_best: ""
