  text: "Which external webpages are linked from Abdul Wali Khan University Mardan, which government agencies is the university affiliated with, and what is the university’s address, if available?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbr: <http://dbpedia.org/resource/>

    SELECT DISTINCT ?externalPage ?agency ?address
    WHERE {
      dbr:Abdul_Wali_Khan_University_Mardan
          dbo:wikiPageExternalLink ?externalPage ;
          dbo:affiliation ?agency .
      ?agency a dbo:GovernmentAgency .

      OPTIONAL {
        dbr:Abdul_Wali_Khan_University_Mardan dbo:address ?address .
      }
    }
  llm_best: ""
  result_count: 1
  result_snippet: |
    externalPage: http://awkum.edu.pk | agency: http://dbpedia.org/resource/Higher_Education_Commission_(Pakistan)
- id: 2
  src_id: 1
  text: "Which five government agencies affiliated with at least one school and at least one organization have the highest numbers of distinct affiliated schools, and how many distinct schools and organizations are affiliated with each?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>

    SELECT ?agency
           (COUNT(DISTINCT ?school) AS ?schoolCount)
           (COUNT(DISTINCT ?organisation) AS ?organisationCount)
    WHERE {
      ?agency a dbo:GovernmentAgency .
      ?school a dbo:School ;
              dbo:affiliation ?agency .
      ?organisation a dbo:Organisation ;
                    dbo:affiliation ?agency .
    }
    GROUP BY ?agency
    ORDER BY DESC(?schoolCount)
    LIMIT 5
  llm_best: true
  result_count: 5
  result_snippet: |
    agency: http://dbpedia.org/resource/Ministry_of_Education_(Malaysia) | schoolCount: 26 | organisationCount: 27
    agency: http://dbpedia.org/resource/Department_of_Education_(Philippines) | schoolCount: 23 | organisationCount: 23
    agency: http://dbpedia.org/resource/Department_of_Science_and_Technology_(Philippines) | schoolCount: 12 | organisationCount: 12
