  text: "Among cities where at least two distinct political parties are headquartered, which 10 have the largest numbers of distinct baseball players born there, and, for each city, how many distinct baseball players were born there and how many distinct political parties are headquartered there?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

    SELECT ?city
           (SAMPLE(?cityName) AS ?cityLabel)
           ?baseballPlayerCount
           ?politicalPartyCount
    WHERE {
      {
        SELECT ?city
               (COUNT(DISTINCT ?player) AS ?baseballPlayerCount)
               (COUNT(DISTINCT ?party) AS ?politicalPartyCount)
        WHERE {
          ?city a dbo:City .
          ?player a dbo:BaseballPlayer ;
                  dbo:birthPlace ?city .
          ?party a dbo:PoliticalParty ;
                 dbo:headquarter ?city .
        }
        GROUP BY ?city
      }

      FILTER(?politicalPartyCount >= 2)

      OPTIONAL {
        ?city rdfs:label ?cityName .
        FILTER(LANG(?cityName) = "en")
      }
    }
    GROUP BY ?city ?baseballPlayerCount ?politicalPartyCount
    ORDER BY DESC(?baseballPlayerCount) ?city
    LIMIT 10
  llm_best: true
  result_count: 10
  result_snippet: |
    city: http://dbpedia.org/resource/Brooklyn,_New_York | cityLabel: Brooklyn, New York | baseballPlayerCount: 221 | politicalPartyCount: 3
    city: http://dbpedia.org/resource/Chicago | cityLabel: Chicago | baseballPlayerCount: 197 | politicalPartyCount: 6
