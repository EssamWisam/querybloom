  text: "Who are the top five American football players by number of distinct NFL seasons for which they served as television announcers, considering only seasons that list at least one city as a location? For each player, how many qualifying seasons are there, and which seasons are they?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>

    SELECT DISTINCT ?player ?seasonCount ?season
    WHERE {
      {
        SELECT ?player (COUNT(DISTINCT ?rankedSeason) AS ?seasonCount)
        WHERE {
          ?rankedSeason a dbo:NationalFootballLeagueSeason ;
              dbp:tvannouncers ?player ;
              dbp:location ?rankedCity .
          ?player a dbo:AmericanFootballPlayer .
          ?rankedCity a dbo:City .
        }
        GROUP BY ?player
        ORDER BY DESC(?seasonCount) ?player
        LIMIT 5
      }
      ?season a dbo:NationalFootballLeagueSeason ;
          dbp:tvannouncers ?player ;
          dbp:location ?city .
      ?city a dbo:City .
