  text: "After standardizing each country entry by retaining only the text after the final slash or hash mark and replacing underscores with spaces, how many stations owned by the Philippine Department of Transportation have a recorded opening date for each resulting country name? Order the results by decreasing station count and then by country name in ascending order."
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>

    SELECT ?country (COUNT(DISTINCT ?station) AS ?stationCount)
    WHERE {
      ?station a dbo:Station ;
               dbo:owner <http://dbpedia.org/resource/Department_of_Transportation_(Philippines)> ;
               dbp:country ?countryValue ;
               dbp:opened ?openingDate .

      BIND(
        REPLACE(
          REPLACE(STR(?countryValue), "^.*[/#]", ""),
          "_", " "
        ) AS ?country
      )
    }
    GROUP BY ?country
    ORDER BY DESC(?stationCount) ?country
