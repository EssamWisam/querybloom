  text: "For each disease that caused the death of Francisco Rafael Arellano Félix or Walter De Giusti, where at least one person is known for the disease and at least one scientist has it as an academic field, who are those people and scientists, and how many distinct individuals are in each group?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbr: <http://dbpedia.org/resource/>

    SELECT DISTINCT ?disease ?person ?scientist ?personCount ?scientistCount
    WHERE {
      {
        dbr:Francisco_Rafael_Arellano_Félix dbo:deathCause ?disease .
      }
      UNION
      {
        dbr:Walter_De_Giusti dbo:deathCause ?disease .
      }

      ?disease a dbo:Disease .
      ?person a dbo:Person ;
              dbo:knownFor ?disease .
      ?scientist a dbo:Scientist ;
                 dbo:academicDiscipline ?disease .

      {
        SELECT ?disease
               (COUNT(DISTINCT ?countedPerson) AS ?personCount)
               (COUNT(DISTINCT ?countedScientist) AS ?scientistCount)
        WHERE {
          ?countedPerson a dbo:Person ;
                         dbo:knownFor ?disease .
          ?countedScientist a dbo:Scientist ;
                            dbo:academicDiscipline ?disease .
        }
        GROUP BY ?disease
      }
    }
