  text: "Among places covered by at least two distinct nonfiction books, which five have the greatest number of distinct musical artists who died there? For each place, how many distinct nonfiction books cover it, and how many distinct musical artists died there, with ties broken by location in ascending order?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>

    SELECT ?location ?bookCount (COUNT(DISTINCT ?artist) AS ?artistCount)
    WHERE {
      {
        SELECT ?location (COUNT(DISTINCT ?book) AS ?bookCount)
        WHERE {
          ?book a dbo:Book ;
                dbo:nonFictionSubject ?location .
        }
        GROUP BY ?location
        HAVING (COUNT(DISTINCT ?book) >= 2)
      }
      ?artist a dbo:MusicalArtist ;
              dbp:deathPlace ?location .
    }
    GROUP BY ?location ?bookCount
    ORDER BY DESC(?artistCount) ?location
    LIMIT 5
  llm_best: true
