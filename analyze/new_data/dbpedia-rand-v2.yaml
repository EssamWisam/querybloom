  text: "Among settlements with at least one road and at least one station they own, which has the largest total area, what is that area in square kilometres, and how many roads and owned stations does it have?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX populatedPlace: <http://dbpedia.org/ontology/PopulatedPlace/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT ?settlement ?areaKm2
           (COUNT(DISTINCT ?road) AS ?roadCount)
           (COUNT(DISTINCT ?station) AS ?stationCount)
    WHERE {
      {
        SELECT DISTINCT ?settlement ?areaKm2
        WHERE {
          ?settlement a dbo:Settlement ;
                      populatedPlace:areaTotal ?areaValue .
          ?qualifyingRoad a dbo:Road ;
                          dbo:city ?settlement .
          ?qualifyingStation a dbo:Station ;
                             dbo:owningOrganisation ?settlement .
          BIND(xsd:double(STR(?areaValue)) AS ?areaKm2)
        }
        ORDER BY DESC(?areaKm2)
        LIMIT 1
      }
      ?road a dbo:Road ;
            dbo:city ?settlement .
      ?station a dbo:Station ;
               dbo:owningOrganisation ?settlement .
    }
    GROUP BY ?settlement ?areaKm2
  llm_best: true
  result_count: 1
  result_snippet: |
    settlement: http://dbpedia.org/resource/Toronto | areaKm2: 630.2 | roadCount: 19 | stationCount: 1
