  text: "Which city or cities have at least one garrisoned military unit and the greatest number of distinct soccer clubs with grounds there, and how many such clubs have grounds in each?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>

    SELECT ?city ?clubCount
    WHERE {
      {
        SELECT ?city (COUNT(DISTINCT ?club) AS ?clubCount)
        WHERE {
          ?city rdf:type dbo:City .
          ?club rdf:type dbo:SoccerClub ;
                dbo:ground ?city .
          FILTER EXISTS {
            ?unit rdf:type dbo:MilitaryUnit ;
                  dbo:garrison ?city .
          }
        }
        GROUP BY ?city
      }
      {
        SELECT (MAX(?candidateClubCount) AS ?maxClubCount)
        WHERE {
          {
            SELECT ?candidateCity (COUNT(DISTINCT ?candidateClub) AS ?candidateClubCount)
            WHERE {
              ?candidateCity rdf:type dbo:City .
              ?candidateClub rdf:type dbo:SoccerClub ;
                             dbo:ground ?candidateCity .
              FILTER EXISTS {
                ?candidateUnit rdf:type dbo:MilitaryUnit ;
                               dbo:garrison ?candidateCity .
              }
            }
            GROUP BY ?candidateCity
          }
        }
      }
      FILTER (?clubCount = ?maxClubCount)
    }
    ORDER BY ?city
  llm_best: ""
  result_count: 1
  result_snippet: |
