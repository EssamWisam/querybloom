  text: "Among universities listed as an alma mater by at least one architect and at least one cleric, which 10 have the largest sum of the numbers of distinct architects and distinct clerics who list them? For each university, what is its city, each of the two counts, and their sum?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>

    SELECT ?university ?city
           (COUNT(DISTINCT ?architect) AS ?architectCount)
           (COUNT(DISTINCT ?cleric) AS ?clericCount)
           ((COUNT(DISTINCT ?architect) + COUNT(DISTINCT ?cleric)) AS ?combinedCount)
    WHERE {
      ?architect a dbo:Architect ;
                 dbp:almaMater ?university .
      ?cleric a dbo:Cleric ;
              dbp:almaMater ?university .
      ?university a dbo:University ;
                  dbp:city ?city .
    }
    GROUP BY ?university ?city
    ORDER BY DESC(?combinedCount)
    LIMIT 10
