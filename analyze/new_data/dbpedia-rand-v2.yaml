- id: 1
  src_id: 1
  text: "Which government agency are Riphah International University and Aga Khan University both affiliated with, and which external webpages are linked from either university, with the university identified for each page?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbr: <http://dbpedia.org/resource/>

    SELECT DISTINCT ?agency ?university ?externalPage
    WHERE {
      dbr:Riphah_International_University dbo:affiliation ?agency .
      dbr:Aga_Khan_University dbo:affiliation ?agency .
      ?agency a dbo:GovernmentAgency .

      {
        dbr:Riphah_International_University
            dbo:wikiPageExternalLink ?externalPage .
        BIND(dbr:Riphah_International_University AS ?university)
      }
      UNION
      {
        dbr:Aga_Khan_University
            dbo:wikiPageExternalLink ?externalPage .
        BIND(dbr:Aga_Khan_University AS ?university)
      }
    }
  llm_best: ""
