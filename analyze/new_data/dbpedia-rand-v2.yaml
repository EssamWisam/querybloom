  text: "Which administrative region has the greatest total area among those associated with at least one university and at least one airport whose elevation is recorded, and what is that region's total area?"
  query: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX dboplace: <http://dbpedia.org/ontology/PopulatedPlace/>

    SELECT DISTINCT ?region ?area
    WHERE {
      ?region rdf:type dbo:AdministrativeRegion ;
              dboplace:areaTotal ?area .
      BIND(xsd:double(STR(?area)) AS ?numericArea)

      ?university rdf:type dbo:University ;
                  dbp:city ?region .
      FILTER EXISTS {
        ?airport rdf:type dbo:Airport ;
                 dbo:city ?region ;
                 dbo:elevation ?airportElevation .
      }

      {
        SELECT (MAX(?candidateNumericArea) AS ?maxArea)
        WHERE {
          ?candidateRegion rdf:type dbo:AdministrativeRegion ;
