  text: "Which five administrative regions under the jurisdiction of at least two government agencies have the highest numbers of military structures, and how many government agencies and military structures are associated with each?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>

    SELECT ?region ?governmentAgencyCount
           (COUNT(DISTINCT ?militaryStructure) AS ?militaryStructureCount)
    WHERE {
      {
        SELECT ?region
               (COUNT(DISTINCT ?governmentAgency) AS ?governmentAgencyCount)
        WHERE {
          ?region a dbo:AdministrativeRegion .
          ?governmentAgency a dbo:GovernmentAgency ;
                            dbo:jurisdiction ?region .
        }
        GROUP BY ?region
      }
      FILTER (?governmentAgencyCount >= 2)
      ?militaryStructure a dbo:MilitaryStructure ;
                         dbo:location ?region .
    }
    GROUP BY ?region ?governmentAgencyCount
    ORDER BY DESC(?militaryStructureCount) ?region
    LIMIT 5
