  text: "Which 10 musical artists born before 1950 and credited with music for television episodes wrote the most singles, and how many distinct singles and television episodes is each credited with?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT DISTINCT ?artist ?singleCount ?episodeCount
    WHERE {
      ?artist a dbo:MusicalArtist ;
              dbp:birthDate ?birthDate .
      FILTER(?birthDate < "1950-01-01"^^xsd:date)

      {
        SELECT ?artist (COUNT(DISTINCT ?single) AS ?singleCount)
        WHERE {
          ?single a dbo:Single ;
                  dbo:writer ?artist .
        }
        GROUP BY ?artist
      }

      {
        SELECT ?artist (COUNT(DISTINCT ?episode) AS ?episodeCount)
        WHERE {
          ?episode a dbo:TelevisionEpisode ;
                   dbp:music ?artist .
        }
        GROUP BY ?artist
      }
    }
    ORDER BY DESC(?singleCount) ?artist
    LIMIT 10
  llm_best: true
  result_count: 10
  result_snippet: |
    artist: http://dbpedia.org/resource/Bob_Dylan | singleCount: 46 | episodeCount: 1
    artist: http://dbpedia.org/resource/Gerry_Rafferty | singleCount: 3 | episodeCount: 1
    artist: http://dbpedia.org/resource/John_Williams | singleCount: 3 | episodeCount: 3
