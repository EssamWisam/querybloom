  text: "Among soccer clubs associated with the 2012 American soccer season, which has the largest whole-number value for highest attendance, and what is that value?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX dbr: <http://dbpedia.org/resource/>
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT DISTINCT ?clubSeason ?highestAttendance
    WHERE {
      ?clubSeason rdf:type dbo:SoccerClub ;
                  dbo:season dbr:2012_in_American_soccer ;
                  dbp:highestAttendance ?highestAttendance .
      FILTER(REGEX(STR(?highestAttendance), "^[0-9]+$"))
