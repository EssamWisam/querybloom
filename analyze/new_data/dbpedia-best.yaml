    SELECT ?officeHolder ?regionCount ?parkCount
    WHERE {
      {
        SELECT ?officeHolder
               (COUNT(DISTINCT ?region) AS ?regionCount)
               (COUNT(DISTINCT ?park) AS ?parkCount)
        WHERE {
          ?park rdf:type dbo:Park ;
                dbo:location ?region .
          ?region rdf:type dbo:AdministrativeRegion ;
                  dbp:namedFor ?officeHolder .
