  text: "Which five settlements that are route junctions on European route E1 have the highest recorded April precipitation, using the highest available April value for each settlement, and what are their total areas in square metres when available?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX dbr: <http://dbpedia.org/resource/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT DISTINCT ?settlement ?aprilPrecipitationMm ?totalAreaSquareMetres
    WHERE {
      {
        SELECT ?settlement
               (MAX(xsd:decimal(?recordedAprilPrecipitationMm)) AS ?aprilPrecipitationMm)
        WHERE {
          dbr:European_route_E1 dbo:routeJunction ?settlement .
          ?settlement a dbo:Settlement ;
                      dbp:aprPrecipitationMm ?recordedAprilPrecipitationMm .
        }
        GROUP BY ?settlement
        ORDER BY DESC(?aprilPrecipitationMm)
        LIMIT 5
      }
      OPTIONAL {
        ?settlement dbo:areaTotal ?totalAreaSquareMetres .
      }
    }
    ORDER BY DESC(?aprilPrecipitationMm)
  llm_best: true
