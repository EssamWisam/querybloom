  text: "Which people other than Alex Bogusky share at least one nationality with him or are known for at least one of the same things, and, for each person, what nationalities do they have and what are they known for?"
  query: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbr: <http://dbpedia.org/resource/>

    SELECT DISTINCT ?person ?nationality ?knownFor
    WHERE {
      dbr:Alex_Bogusky dbo:nationality ?alexNationality ;
                         dbo:knownFor ?alexSubject .
      ?person rdf:type dbo:Person ;
              dbo:nationality ?nationality ;
              dbo:knownFor ?knownFor .
      {
        ?person dbo:knownFor ?alexSubject .
      }
      UNION
      {
        ?person dbo:nationality ?alexNationality .
