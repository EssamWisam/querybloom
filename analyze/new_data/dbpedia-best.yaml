  text: "Among Afghanistan, Albania, and Algeria, which countries have more universities than the average for the three, and what are each qualifying country’s university count and capital, along with that average, with the countries ordered from highest to lowest university count?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbr: <http://dbpedia.org/resource/>

    SELECT ?country ?capital ?universityCount ?averageUniversityCount
    WHERE {
      {
        SELECT ?country (COUNT(DISTINCT ?university) AS ?universityCount)
        WHERE {
          VALUES ?country {
            dbr:Afghanistan
            dbr:Albania
            dbr:Algeria
          }
          ?university a dbo:University ;
                      dbo:country ?country .
        }
        GROUP BY ?country
      }
      {
        SELECT (AVG(?countryCount) AS ?averageUniversityCount)
        WHERE {
          {
            SELECT ?countCountry (COUNT(DISTINCT ?countUniversity) AS ?countryCount)
            WHERE {
              VALUES ?countCountry {
                dbr:Afghanistan
                dbr:Albania
                dbr:Algeria
              }
              ?countUniversity a dbo:University ;
                               dbo:country ?countCountry .
            }
            GROUP BY ?countCountry
          }
        }
      }
      ?country dbo:capital ?capital .
      FILTER(?universityCount > ?averageUniversityCount)
    }
    ORDER BY DESC(?universityCount)
  llm_best: true
  result_count: 1
  result_snippet: |
    country: http://dbpedia.org/resource/Afghanistan | capital: http://dbpedia.org/resource/Kabul | universityCount: 51 | averageUniversityCount: 39.0
