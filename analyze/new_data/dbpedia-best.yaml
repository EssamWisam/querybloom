  text: "Between Edinburgh and Auckland, which city has the lower April record-low temperature, and by how many degrees Celsius is it lower than the other city’s April record low?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX dbr: <http://dbpedia.org/resource/>
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT DISTINCT ?colderCity ?differenceCelsius
    WHERE {
      dbr:Edinburgh rdf:type dbo:City ;
                    dbp:aprRecordLowC ?edinburghLow .
      dbr:Auckland rdf:type dbo:City ;
                   dbp:aprRecordLowC ?aucklandLow .

      BIND(xsd:decimal(STR(?edinburghLow)) AS ?edinburghValue)
      BIND(xsd:decimal(STR(?aucklandLow)) AS ?aucklandValue)
      FILTER(?edinburghValue != ?aucklandValue)

      BIND(
        IF(?edinburghValue < ?aucklandValue, dbr:Edinburgh, dbr:Auckland)
        AS ?colderCity
      )
      BIND(
        IF(
          ?edinburghValue < ?aucklandValue,
          ?aucklandValue - ?edinburghValue,
          ?edinburghValue - ?aucklandValue
        ) AS ?differenceCelsius
      )
    }
  llm_best: true
  result_count: 1
  result_snippet: |
    colderCity: http://dbpedia.org/resource/Edinburgh | differenceCelsius: 10.0
