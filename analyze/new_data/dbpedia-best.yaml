  text: "Which country or countries do the greatest number of darts players have as their hometown, and how many darts players have each one as their hometown?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>

    SELECT ?country ?dartsPlayerCount
    WHERE {
      {
        SELECT ?country (COUNT(DISTINCT ?dartsPlayer) AS ?dartsPlayerCount)
        WHERE {
          ?dartsPlayer a dbo:DartsPlayer ;
              dbo:hometown ?country .
          ?country a dbo:Country .
        }
        GROUP BY ?country
      }
      {
        SELECT (MAX(?candidateCount) AS ?maximumCount)
        WHERE {
          {
            SELECT ?candidateCountry (COUNT(DISTINCT ?candidatePlayer) AS ?candidateCount)
            WHERE {
              ?candidatePlayer a dbo:DartsPlayer ;
                  dbo:hometown ?candidateCountry .
              ?candidateCountry a dbo:Country .
            }
            GROUP BY ?candidateCountry
          }
        }
      }
      FILTER (?dartsPlayerCount = ?maximumCount)
    }
    ORDER BY ?country
  llm_best: true
  result_count: 1
  result_snippet: |
    country: http://dbpedia.org/resource/England | dartsPlayerCount: 44
- id: 95
