  text: "What are Kerala’s recorded April rainfall and August high temperature, and which 10 places have the highest April rainfall among those with more April rainfall than Kerala, listed in descending order and with each place’s August high temperature included when available?"
  query: |
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX dbr: <http://dbpedia.org/resource/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT DISTINCT ?keralaAprilRainfallMm ?keralaAugustHighC
                    ?place ?placeAprilRainfallMm ?placeAugustHighC
    WHERE {
      dbr:Kerala dbp:aprRainMm ?keralaAprilRainfallMm ;
                  dbp:augHighC ?keralaAugustHighC .

      ?place dbp:aprRainMm ?placeAprilRainfallMm .
      FILTER(
        xsd:decimal(?placeAprilRainfallMm) >
        xsd:decimal(?keralaAprilRainfallMm)
      )

      OPTIONAL {
        ?place dbp:augHighC ?placeAugustHighC .
      }
    }
    ORDER BY DESC(xsd:decimal(?placeAprilRainfallMm))
    LIMIT 10
