  text: "Which organisation or organisations own the greatest number of stations in the administrative region of Norfolk, and how many such stations do they own?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX dbr: <http://dbpedia.org/resource/>

    SELECT ?owner ?stationCount
    WHERE {
      {
        SELECT ?owner (COUNT(DISTINCT ?station) AS ?stationCount)
        WHERE {
          dbr:Norfolk a dbo:AdministrativeRegion .
          ?station a dbo:Station ;
              dbp:borough dbr:Norfolk ;
              dbp:owned ?owner .
          ?owner a dbo:Organisation .
        }
        GROUP BY ?owner
      }
      {
        SELECT (MAX(?candidateCount) AS ?maxStationCount)
        WHERE {
          {
            SELECT ?candidateOwner (COUNT(DISTINCT ?candidateStation) AS ?candidateCount)
            WHERE {
              dbr:Norfolk a dbo:AdministrativeRegion .
              ?candidateStation a dbo:Station ;
                  dbp:borough dbr:Norfolk ;
                  dbp:owned ?candidateOwner .
              ?candidateOwner a dbo:Organisation .
            }
            GROUP BY ?candidateOwner
          }
        }
      }
      FILTER(?stationCount = ?maxStationCount)
    }
  llm_best: true
