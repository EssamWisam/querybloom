  text: "For each country that contains at least one island and serves as the garrison country of at least one military unit with a recorded active-service start year, how many distinct islands and such military units are associated with it? Order the countries by descending island count, then by descending military-unit count, and finally by ascending country URI."
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>

    SELECT ?country ?islandCount ?militaryUnitCount
    WHERE {
      {
        SELECT ?country (COUNT(DISTINCT ?island) AS ?islandCount)
        WHERE {
          ?country a dbo:Country .
          ?island a dbo:Island ;
                  dbo:location ?country .
        }
        GROUP BY ?country
      }
      {
        SELECT ?country (COUNT(DISTINCT ?militaryUnit) AS ?militaryUnitCount)
        WHERE {
          ?country a dbo:Country .
          ?militaryUnit a dbo:MilitaryUnit ;
                        dbo:garrison ?country .
          FILTER EXISTS {
            ?militaryUnit dbo:activeYearsStartYear ?startYear .
