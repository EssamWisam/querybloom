  text: "What were the highest attendances for Stoke in the 1897–98 season and for the corresponding Football League season, and what was the difference calculated by subtracting Stoke’s figure from the league season’s figure?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT ?stokeHighestAttendance ?leagueHighestAttendance ?attendanceDifference
    WHERE {
      <http://dbpedia.org/resource/1897–98_Stoke_F.C._season>
          dbo:league ?leagueSeason ;
          dbp:highestAttendance ?stokeHighestAttendance .
      ?leagueSeason dbp:highestAttendance ?leagueHighestAttendance .

      FILTER(
        isNumeric(?stokeHighestAttendance) &&
        isNumeric(?leagueHighestAttendance)
      )

      BIND(
        xsd:integer(?leagueHighestAttendance) - xsd:integer(?stokeHighestAttendance)
        AS ?attendanceDifference
      )
    }
