  text: "Among Vienna, Stockholm, and Rome, which place or places have the highest April record-high temperature, and which have the lowest April rainfall? For each measure with a recorded value for at least one of the three places, include all places tied for the relevant extreme and give the temperature in degrees Celsius or the rainfall in millimetres."
  query: |
    PREFIX dbr: <http://dbpedia.org/resource/>
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT DISTINCT ?place ?criterion ?value
    WHERE {
      {
        VALUES ?place { dbr:Vienna dbr:Stockholm dbr:Rome }
        ?place dbp:aprRecordHighC ?rawTemperature .
        {
          SELECT (MAX(xsd:decimal(?candidateTemperature)) AS ?highestTemperature)
          WHERE {
            VALUES ?candidatePlace { dbr:Vienna dbr:Stockholm dbr:Rome }
            ?candidatePlace dbp:aprRecordHighC ?candidateTemperature .
          }
        }
        FILTER(xsd:decimal(?rawTemperature) = ?highestTemperature)
        BIND("highest April record high temperature (°C)" AS ?criterion)
        BIND(?rawTemperature AS ?value)
      }
      UNION
      {
        VALUES ?place { dbr:Vienna dbr:Stockholm dbr:Rome }
        ?place dbp:aprRainMm ?rawRainfall .
        {
          SELECT (MIN(xsd:decimal(?candidateRainfall)) AS ?lowestRainfall)
          WHERE {
            VALUES ?candidatePlace { dbr:Vienna dbr:Stockholm dbr:Rome }
            ?candidatePlace dbp:aprRainMm ?candidateRainfall .
          }
        }
        FILTER(xsd:decimal(?rawRainfall) = ?lowestRainfall)
        BIND("lowest April rainfall (mm)" AS ?criterion)
        BIND(?rawRainfall AS ?value)
      }
    }
  llm_best: true
  result_count: 1
  result_snippet: |
    place: http://dbpedia.org/resource/Vienna | criterion: highest April record high temperature (°C) | value: 29.5
