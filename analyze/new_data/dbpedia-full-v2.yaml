      {
        SELECT (MAX(?candidateCount) AS ?maxRoadCount)
        WHERE {
          {
            SELECT ?candidate (COUNT(DISTINCT ?candidateRoad) AS ?candidateCount)
            WHERE {
              VALUES ?candidate { dbr:California dbr:Alberta }
              OPTIONAL {
                ?candidateRoad a dbo:Road ;
                               dbo:routeEnd ?candidate .
              }
            }
            GROUP BY ?candidate
          }
        }
      }
      FILTER(?roadCount = ?maxRoadCount)
    }
    ORDER BY ?settlement
