  text: "How many distinct ships are owned by New York City, the place of death of ice hockey player Allan Wilson, and which distinct operators, if any, operate those ships?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbr: <http://dbpedia.org/resource/>

    SELECT ?shipCount ?operators
    WHERE {
      {
        SELECT (COUNT(DISTINCT ?ship) AS ?shipCount)
        WHERE {
          dbr:New_York_City a dbo:City .
          <http://dbpedia.org/resource/Allan_Wilson_(ice_hockey)>
              a dbo:IceHockeyPlayer ;
              dbo:deathPlace dbr:New_York_City .
          ?ship a dbo:Ship ;
              dbo:owner dbr:New_York_City .
        }
      }
      {
        SELECT (GROUP_CONCAT(DISTINCT STR(?operator); SEPARATOR=", ") AS ?operators)
        WHERE {
          dbr:New_York_City a dbo:City .
          <http://dbpedia.org/resource/Allan_Wilson_(ice_hockey)>
              a dbo:IceHockeyPlayer ;
              dbo:deathPlace dbr:New_York_City .
          ?ship a dbo:Ship ;
              dbo:owner dbr:New_York_City ;
              dbo:operator ?operator .
        }
      }
    }
