  text: "Among city districts that are endpoints of roads and lie within an administrative region, which has the largest total area, what is that area in square kilometres, which administrative region contains it, and, where available, what are its motto and namesake?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT DISTINCT ?cityDistrict ?areaKm2 ?administrativeRegion ?motto ?namesake
    WHERE {
      {
        SELECT (MAX(xsd:double(?candidateArea)) AS ?areaKm2)
        WHERE {
          ?candidate a dbo:CityDistrict ;
              dbp:areaTotalKm ?candidateArea ;
              dbo:subdivision ?candidateRegion .
          ?candidateRegion a dbo:AdministrativeRegion .
          ?candidateRoad a dbo:Road ;
              dbo:routeEnd ?candidate .
        }
      }
      ?cityDistrict a dbo:CityDistrict ;
          dbp:areaTotalKm ?rawArea ;
          dbo:subdivision ?administrativeRegion .
      ?administrativeRegion a dbo:AdministrativeRegion .
      ?road a dbo:Road ;
          dbo:routeEnd ?cityDistrict .
      FILTER(xsd:double(?rawArea) = ?areaKm2)

      OPTIONAL { ?cityDistrict dbo:motto ?motto . }
      OPTIONAL { ?cityDistrict dbp:namedFor ?namesake . }
    }
  llm_best: ""
