  text: "Of Corfu and Orkney, which island has the higher maximum reported August high temperature, and what are the minimum and maximum reported August high temperatures for each island in degrees Celsius?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX dbr: <http://dbpedia.org/resource/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT ?islandWithHigherMaximum
           ?corfuMinimumAugustHighC
           ?corfuMaximumAugustHighC
           ?orkneyMinimumAugustHighC
           ?orkneyMaximumAugustHighC
    WHERE {
      {
        SELECT (MIN(xsd:double(?value)) AS ?corfuMinimumAugustHighC)
               (MAX(xsd:double(?value)) AS ?corfuMaximumAugustHighC)
        WHERE {
          dbr:Corfu a dbo:Island ;
                    dbp:augHighC ?value .
        }
      }
      {
        SELECT (MIN(xsd:double(?value)) AS ?orkneyMinimumAugustHighC)
               (MAX(xsd:double(?value)) AS ?orkneyMaximumAugustHighC)
        WHERE {
          dbr:Orkney a dbo:Island ;
                     dbp:augHighC ?value .
        }
      }
      BIND(
        IF(
          ?corfuMaximumAugustHighC > ?orkneyMaximumAugustHighC,
          dbr:Corfu,
          dbr:Orkney
        ) AS ?islandWithHigherMaximum
      )
    }
  llm_best: true
