  src_id: 119
  text: "Which up to ten saints who have a major shrine in a place where they were canonized have the latest fully specified death dates between 1900 and 2099, and what are those shared places and death dates?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>

    SELECT DISTINCT ?saint ?place ?deathDate
    WHERE {
      {
        SELECT ?saint (MAX(STR(?rawDeathDate)) AS ?deathDate)
        WHERE {
          ?saint a dbo:Saint ;
                 dbo:majorShrine ?candidatePlace ;
                 dbo:canonizedPlace ?candidatePlace ;
                 dbp:deathDate ?rawDeathDate .
          FILTER(
            isLiteral(?rawDeathDate) &&
            REGEX(STR(?rawDeathDate), "^(19|20)[0-9]{2}-[0-9]{2}-[0-9]{2}$")
          )
        }
        GROUP BY ?saint
