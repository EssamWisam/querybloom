- id: 392
  src_id: 107
  text: "Among Bratislava, Oslo, and Rome, which settlement has the greatest total area, and by how many square metres does it exceed the smallest of the three?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbr: <http://dbpedia.org/resource/>

    SELECT ?largestSettlement ?differenceInSquareMetres
    WHERE {
      {
        SELECT (MIN(?candidateArea) AS ?smallestArea)
        WHERE {
          VALUES ?candidateSettlement {
            dbr:Bratislava
            dbr:Oslo
            dbr:Rome
          }
          ?candidateSettlement a dbo:Settlement ;
                               dbo:areaTotal ?candidateArea .
        }
      }

      VALUES ?largestSettlement {
        dbr:Bratislava
        dbr:Oslo
        dbr:Rome
      }
      ?largestSettlement a dbo:Settlement ;
                         dbo:areaTotal ?largestArea .

      BIND(?largestArea - ?smallestArea AS ?differenceInSquareMetres)
    }
    ORDER BY DESC(?largestArea)
    LIMIT 1
  llm_best: true
  result_count: 1
  result_snippet: |
    largestSettlement: http://dbpedia.org/resource/Rome | differenceInSquareMetres: 917827099.1598
