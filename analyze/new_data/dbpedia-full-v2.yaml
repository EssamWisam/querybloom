  text: "Among writers with at least one recorded citizenship, which five have the highest child counts when only values written entirely in digits are considered and each writer’s highest qualifying value is used? For each writer, what is that count, and which citizenships are recorded?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT DISTINCT ?writer ?citizenship ?children
    WHERE {
      {
        SELECT ?writer (MAX(xsd:integer(STR(?rawChildren))) AS ?children)
        WHERE {
          ?writer a dbo:Writer ;
              dbo:citizenship ?anyCitizenship ;
              dbp:children ?rawChildren .
          FILTER(REGEX(STR(?rawChildren), "^[0-9]+$"))
