  text: "Among the locomotives listed as rolling stock for railway lines operated by Indian Railways, which have the greatest recorded length, on which of those lines are they listed, and, where available, what are their power type, builder’s model, and build date?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX dbr: <http://dbpedia.org/resource/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT DISTINCT ?locomotive ?line ?length ?powerType ?buildModel ?buildDate
    WHERE {
      ?line a dbo:RailwayLine ;
          dbp:operator dbr:Indian_Railways ;
          dbo:railwayRollingStock ?locomotive .
      ?locomotive a dbo:Locomotive ;
          dbo:length ?length .

      {
        SELECT (MAX(xsd:double(?candidateLength)) AS ?maximumLength)
        WHERE {
          ?candidateLine a dbo:RailwayLine ;
              dbp:operator dbr:Indian_Railways ;
              dbo:railwayRollingStock ?candidateLocomotive .
          ?candidateLocomotive a dbo:Locomotive ;
              dbo:length ?candidateLength .
        }
      }

      FILTER(xsd:double(?length) = ?maximumLength)

      OPTIONAL { ?locomotive dbp:powertype ?powerType . }
      OPTIONAL { ?locomotive dbp:buildmodel ?buildModel . }
      OPTIONAL { ?locomotive dbp:builddate ?buildDate . }
    }
