  text: "Among trains whose operators are public transit systems located in at least one settlement, which have the greatest stated capacity when only whole-number capacities are considered, and what are each train’s operator, capacity, and any available braking details?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbp: <http://dbpedia.org/property/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT DISTINCT ?train ?operator ?capacity ?brakes
    WHERE {
      ?train a dbo:Train ;
          dbp:operator ?operator ;
          dbp:capacity ?capacity .
      ?operator a dbo:PublicTransitSystem ;
          dbo:location ?location .
      ?location a dbo:Settlement .
      FILTER(REGEX(STR(?capacity), "^[0-9]+$"))
      BIND(xsd:integer(STR(?capacity)) AS ?numericCapacity)

      {
        SELECT (MAX(?candidateCapacity) AS ?maxCapacity)
        WHERE {
          ?candidateTrain a dbo:Train ;
              dbp:operator ?candidateOperator ;
