- id: 659
  src_id: 181
  text: "In which country is the city where the Sindh cricket team's ground is located, what is that country's total population, and where does it rank by population, from highest to lowest, among countries with recorded populations that contain cities where cricket teams have grounds?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX dbr: <http://dbpedia.org/resource/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT ?country ?population
           (COUNT(DISTINCT ?rankEntry) AS ?populationRank)
    WHERE {
      dbr:Sindh_cricket_team a dbo:CricketTeam ;
                             dbo:ground ?city .
      ?city a dbo:City ;
            dbo:country ?country .
      ?country dbo:populationTotal ?populationRaw .
      BIND(xsd:integer(STR(?populationRaw)) AS ?population)
      BIND(1 AS ?joinKey)

      {
        SELECT DISTINCT ?joinKey ?candidateCountry ?candidatePopulation
        WHERE {
          BIND(1 AS ?joinKey)
          ?candidateTeam a dbo:CricketTeam ;
                         dbo:ground ?candidateCity .
          ?candidateCity a dbo:City ;
                         dbo:country ?candidateCountry .
          ?candidateCountry dbo:populationTotal ?candidatePopulationRaw .
          BIND(xsd:integer(STR(?candidatePopulationRaw)) AS ?candidatePopulation)
        }
      }

      BIND(
        IF(
          ?candidateCountry != ?country && ?candidatePopulation > ?population,
          ?candidateCountry,
          <urn:population-rank-base>
        ) AS ?rankEntry
      )
    }
    GROUP BY ?country ?population
  llm_best: true
  result_count: 1
  result_snippet: |
    country: http://dbpedia.org/resource/Pakistan | population: 242923845 | populationRank: 3
