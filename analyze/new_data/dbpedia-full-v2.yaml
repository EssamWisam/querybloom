  text: "Among the cities in which at least one politician born before 1900 resided, which city or cities have the largest number of distinct soccer players who died there, and what is that number?"
  query: |
    PREFIX dbo: <http://dbpedia.org/ontology/>
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT ?city ?soccerPlayerCount
    WHERE {
      {
        SELECT ?city (COUNT(DISTINCT ?soccerPlayer) AS ?soccerPlayerCount)
        WHERE {
          ?city rdf:type dbo:City .
          ?soccerPlayer rdf:type dbo:SoccerPlayer ;
                        dbo:deathPlace ?city .
          FILTER EXISTS {
            ?historicalPolitician rdf:type dbo:Politician ;
                                  dbo:residence ?city ;
                                  dbo:birthDate ?historicalBirthDate .
            FILTER(?historicalBirthDate < "1900-01-01"^^xsd:date)
          }
        }
        GROUP BY ?city
      }
      {
        SELECT (MAX(?candidateCount) AS ?maximumCount)
        WHERE {
          {
            SELECT ?candidateCity (COUNT(DISTINCT ?candidateSoccerPlayer) AS ?candidateCount)
            WHERE {
              ?candidateCity rdf:type dbo:City .
              ?candidateSoccerPlayer rdf:type dbo:SoccerPlayer ;
                                      dbo:deathPlace ?candidateCity .
              FILTER EXISTS {
                ?candidateHistoricalPolitician rdf:type dbo:Politician ;
                                                dbo:residence ?candidateCity ;
                                                dbo:birthDate ?candidateBirthDate .
                FILTER(?candidateBirthDate < "1900-01-01"^^xsd:date)
              }
            }
            GROUP BY ?candidateCity
          }
        }
      }
      FILTER(?soccerPlayerCount = ?maximumCount)
    }
    ORDER BY ?city
  llm_best: true
  result_count: 1
  result_snippet: |
    city: http://dbpedia.org/resource/Edinburgh | soccerPlayerCount: 80
