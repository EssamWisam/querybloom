        SELECT ?player (COUNT(DISTINCT ?rankedSeason) AS ?seasonCount)
        WHERE {
          ?rankedSeason a dbo:NationalFootballLeagueSeason ;
              dbp:tvannouncers ?player ;
              dbp:location ?rankedCity .
          ?player a dbo:AmericanFootballPlayer .
          ?rankedCity a dbo:City .
