[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.26"]

[project]
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "platformdirs>=4",
  "PyYAML>=6",
  "rdflib>=7",
  "tqdm>=4.66",
  "typing-extensions>=4.12",
]
description = "Reproducible evaluation of NL-to-SPARQL benchmarks"
name = "kg-benchmark-eval"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.optional-dependencies]
plots = ["matplotlib>=3.8", "pygments>=2.17", "scikit-learn>=1.4", "scipy>=1.12", "seaborn>=0.13"]
semantic = ["sentence-transformers>=3"]
tables = ["pandas>=2.1"]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6", "types-PyYAML>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/kg_benchmark_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
mypy_path = "src"
packages = ["kg_benchmark_eval"]
python_version = "3.10"
strict = true
