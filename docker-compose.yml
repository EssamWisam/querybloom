services:
  querybloom-frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"]
    ports:
      - "127.0.0.1:5174:5173"
    environment:
      BASE_PATH: /querybloom
      BACKEND_HOST: querybloom-prod
      BACKEND_PORT: "8000"
      FRONTEND_PUBLIC_HOST: idir.sockg.org
    volumes:
      - ./webapp:/app
      - frontend_node_modules:/app/node_modules
      - frontend_svelte_kit:/app/.svelte-kit
    depends_on:
      - querybloom-prod
    restart: unless-stopped

  querybloom-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: querybloom-prod
    ports:
      - "8002:8000"
    env_file:
      - ../querybloom-supabase/.env
      - .env
    environment:
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_ANON_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      SUPABASE_DB_URL: ""
    volumes:
      - .:/workspace/querybloom
      - /workspace/querybloom/.venv
      - /workspace/querybloom/webapp/node_modules
    restart: unless-stopped
    networks:
      - default
      - supabase

  querybloom-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: querybloom-dev
    ports:
      - "8003:8000"
    env_file:
      - .env
    volumes:
      - .:/workspace/querybloom
      - /workspace/querybloom/.venv
      - /workspace/querybloom/webapp/node_modules
    restart: unless-stopped

volumes:
  frontend_node_modules:
  frontend_svelte_kit:

networks:
  supabase:
    external: true
    name: supabase_default
