services:
  querybloom-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: querybloom-prod
    ports:
      - "8002:8000"
    env_file:
      - ../querybloom-supabase/.env
      - .env
    environment:
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_ANON_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      SUPABASE_DB_URL: ""
    volumes:
      - .:/workspace/querybloom
      - /workspace/querybloom/.venv
      - /workspace/querybloom/webapp/node_modules
    restart: unless-stopped
    networks:
      - default
      - supabase

  querybloom-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: querybloom-dev
    ports:
      - "8003:8000"
    env_file:
      - .env
    volumes:
      - .:/workspace/querybloom
      - /workspace/querybloom/.venv
      - /workspace/querybloom/webapp/node_modules
    restart: unless-stopped

networks:
  supabase:
    external: true
    name: supabase_default
