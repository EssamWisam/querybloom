<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Bloom Pipeline</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --border-color: #333;
            --accent-color: #2563eb;
            --card-bg: #fff;
            --phase-label-bg: #fff;
            --phase-border: #e5e7eb;
            --arrow-color: #4b5563;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
            width: 100%;
            max-width: 1200px;
        }

        /* Phase Styling */
        .phase-container {
            position: relative;
            padding: 50px 40px 40px 40px;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
            background: #f8fafc;
        }

        .phase-container.phase-2 {
            background: #f0fdf4;
            border-color: #86efac;
        }

        .phase-label {
            position: absolute;
            top: -18px;
            left: 30px;
            background: var(--phase-label-bg);
            padding: 5px 15px;
            font-size: 18px;
            font-weight: 800;
            color: #475569;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .phase-2 .phase-label {
            color: #166534;
            border-color: #86efac;
        }

        /* Flow Layout */
        .steps-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
        }

        .steps-grid-3 {
            display: grid;
            grid-template-columns: auto 1fr auto 1fr auto;
            align-items: center;
            width: 100%;
            row-gap: 10px;
        }

        .steps-grid-4 {
            display: grid;
            grid-template-columns: auto 1fr auto 1fr auto 1fr auto;
            align-items: center;
            width: 100%;
            row-gap: 10px;
        }

        .grid-arrow {
            display: flex;
            align-items: center;
            min-width: 20px;
            margin-top: -30px;
        }

        .grid-arrow::before {
            content: '';
            flex: 1;
            height: 0;
            border-top: 2px solid var(--arrow-color);
        }

        .grid-arrow::after {
            content: '';
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 10px solid var(--arrow-color);
        }

        .grid-arrow-left {
            display: flex;
            align-items: center;
            min-width: 20px;
            margin-top: -30px;
            flex-direction: row-reverse;
        }

        .grid-arrow-left::before {
            content: '';
            flex: 1;
            height: 0;
            border-top: 2px solid var(--arrow-color);
        }

        .grid-arrow-left::after {
            content: '';
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-right: 10px solid var(--arrow-color);
        }

        .grid-arrow-down {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            padding-right: 80px;
            font-size: 0;
            line-height: 0;
            color: transparent;
            margin: -4px 0;
        }

        .grid-arrow-down::before {
            content: '';
            width: 0;
            height: 16px;
            border-left: 2px solid var(--arrow-color);
            margin-right: 6px;
        }

        .grid-arrow-down::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 10px solid var(--arrow-color);
        }

        .grid-arrow-double {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
            min-width: 30px;
            margin-top: -30px;
        }

        .double-arrow-r,
        .double-arrow-l {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .double-arrow-l {
            flex-direction: row-reverse;
        }

        .double-arrow-r::before,
        .double-arrow-l::before {
            content: '';
            flex: 1;
            height: 0;
            border-top: 2px solid var(--arrow-color);
        }

        .double-arrow-r::after {
            content: '';
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 10px solid var(--arrow-color);
        }

        .double-arrow-l::after {
            content: '';
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-right: 10px solid var(--arrow-color);
        }

        /* Feedback / Light Arrows */
        .arrow-light::before {
            border-color: #94a3b8 !important;
        }

        .double-arrow-r.arrow-light::after {
            border-left-color: #94a3b8 !important;
        }

        .double-arrow-l.arrow-light::after {
            border-right-color: #94a3b8 !important;
        }

        .steps-extra-row {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        /* Card / Figure Style */
        .figure-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 200px;
            /* Bigger width */
            flex-shrink: 0;
        }

        .visual-block {
            width: 200px;
            height: 160px;
            /* Bigger height */
            background: #ffffff;
            border: 2px dashed #94a3b8;
            /* Dashed block around graph */
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .visual-block:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: var(--accent-color);
        }

        .phase-2 .visual-block {
            border-color: #4ade80;
        }

        .figure-title {
            font-size: 14px;
            /* Title below */
            font-weight: 700;
            text-align: center;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Arrows */
        .arrow-right {
            align-self: center;
            color: var(--arrow-color);
            font-size: 24px;
            margin-top: -30px;
            /* Align visually with center of block */
        }

        .arrow-down-large {
            font-size: 40px;
            color: var(--arrow-color);
            margin: -20px 0;
        }

        /* SVG Internal Styles */
        svg {
            overflow: visible;
        }

        .node-rect {
            fill: #f1f5f9;
            stroke: #334155;
            stroke-width: 1.5;
            rx: 4;
        }

        .node-circle {
            fill: #eff6ff;
            stroke: #2563eb;
            stroke-width: 2;
        }

        .edge-path {
            fill: none;
            stroke: #64748b;
            stroke-width: 1.5;
            marker-end: url(#arrowhead);
        }

        .text-label {
            font-family: monospace;
            font-size: 10px;
            fill: #334155;
            text-anchor: middle;
            font-weight: bold;
        }

        .edge-label {
            font-family: monospace;
            font-size: 9px;
            fill: #64748b;
            text-anchor: middle;
            background: white;
        }

        /* Specific Phase 2 colors */
        .p2-node {
            fill: #f0fdf4;
            stroke: #16a34a;
        }

        .p2-edge {
            stroke: #16a34a;
        }

        /* Step 2 specific styles for table */
        .table-rect {
            fill: #fff;
            stroke: #94a3b8;
            stroke-width: 1;
        }

        .table-header {
            fill: #f1f5f9;
        }

        .table-text {
            font-family: monospace;
            font-size: 9px;
            fill: #475569;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .visual-block {
                box-shadow: none !important;
            }

            .visual-block:hover {
                transform: none;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

    <!-- SVG Definitions for markers -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
        <defs>
            <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
            </marker>
            <marker id="arrowhead-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
                orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
            </marker>
        </defs>
    </svg>

    <div id="app" class="container"></div>

    <script>
        // =====================================================================
        //  SVG PRIMITIVE HELPERS
        //  Reusable building blocks for constructing SVG diagrams.
        //  To add a new step, define its svg() using these helpers + raw SVG.
        // =====================================================================

        /** Wrap content in an <svg> element with matching viewBox. */
        const svgEl = (w, h, content) =>
            `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${content}</svg>`;

        /**
         * Labeled rectangle node.
         * Text is auto-centered: textY = y + round(h/2) + 4.
         * Pass label=null to render only the rect (e.g. attribute boxes).
         *
         * opts: { style, textFill, fontSize, cls, attrs }
         */
        const node = (x, y, w, h, label, opts = {}) => {
            const { style = '', textFill = '', fontSize = '', cls = 'node-rect', attrs = '' } = opts;
            const textY = y + Math.round(h / 2) + 4;
            let html = `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${cls}"`;
            if (style) html += ` style="${style}"`;
            if (attrs) html += ` ${attrs}`;
            html += ' />';
            if (label) {
                html += `<text x="${x + w / 2}" y="${textY}" class="text-label"`;
                if (textFill) html += ` fill="${textFill}"`;
                if (fontSize) html += ` style="font-size:${fontSize}"`;
                html += `>${label}</text>`;
            }
            return html;
        };

        /** SVG <path> element, defaults to class="edge-path" (with arrowhead marker). */
        const pathEl = (d, { cls = 'edge-path', style = '', attrs = '' } = {}) => {
            let html = `<path d="${d}"`;
            if (cls) html += ` class="${cls}"`;
            if (style) html += ` style="${style}"`;
            if (attrs) html += ` ${attrs}`;
            html += ' />';
            return html;
        };

        /** Simple line from (x1,y1)→(x2,y2). No CSS class, no arrowhead. */
        const line = (x1, y1, x2, y2, stroke = '#64748b', sw = null, attrs = '') => {
            let html = `<path d="M${x1} ${y1} L${x2} ${y2}" fill="none" stroke="${stroke}"`;
            if (sw !== null) html += ` stroke-width="${sw}"`;
            if (attrs) html += ` ${attrs}`;
            html += ' />';
            return html;
        };

        /** Text label inside SVG. */
        const label = (x, y, text, { cls = 'text-label', fill = '', fontSize = '', attrs = '' } = {}) => {
            let html = `<text x="${x}" y="${y}" class="${cls}"`;
            if (fill) html += ` fill="${fill}"`;
            if (fontSize) html += ` font-size="${fontSize}"`;
            if (attrs) html += ` ${attrs}`;
            html += `>${text}</text>`;
            return html;
        };

        /** Small edge label (monospace, gray). */
        const edgeLabel = (x, y, text) =>
            `<text x="${x}" y="${y}" class="edge-label">${text}</text>`;

        /** Small numbered circle (white bg, colored border). */
        const numCircle = (x, y, num, color = '#64748b') =>
            `<g transform="translate(${x}, ${y})">
            <circle cx="0" cy="0" r="5.5" fill="white" stroke="${color}" stroke-width="1" />
            <text x="0" y="2.5" text-anchor="middle" font-size="7" font-weight="900" fill="${color}">${num}</text>
        </g>`;

        // =====================================================================
        //  COMPOSITE SVG COMPONENTS
        // =====================================================================


        const triplePattern = (tx, ty, leftLabel, rightLabel, edgeLbl) =>
            `<g transform="translate(${tx}, ${ty})">
            ${node(0, 0, 40, 20, leftLabel)}
            ${node(80, 0, 40, 20, rightLabel)}
            ${pathEl('M40 10 L80 10')}
            ${edgeLabel(60, 8, edgeLbl)}
        </g>`;

        /**
         * Mini triple (no labels, smaller boxes) for the adjacency index table.
         * To add more rows, add another miniTriple() at a new (tx, ty).
         */
        const miniTriple = (tx, ty, opts = {}) => {
            const { rectStyle = '' } = opts;
            return `<g transform="translate(${tx}, ${ty})">
            <rect x="0" y="0" width="25" height="12" class="node-rect" stroke-width="1" ${rectStyle ? `style="${rectStyle}"` : ''} />
            <path d="M25 6 L45 6" class="edge-path" stroke-width="1" />
            <rect x="45" y="0" width="25" height="12" class="node-rect" stroke-width="1" ${rectStyle ? `style="${rectStyle}"` : ''} />
        </g>`;
        };

        // =====================================================================
        //  LAYOUT HELPERS
        // =====================================================================

        /** Figure card: visual-block wrapper + title underneath. */
        const figureCard = (title, svgContent, { cardStyle = '', blockStyle = '', titleStyle = '' } = {}) =>
            `<div class="figure-card"${cardStyle ? ` style="${cardStyle}"` : ''}>
            <div class="visual-block"${blockStyle ? ` style="${blockStyle}"` : ''}>
                ${svgContent}
            </div>
            <div class="figure-title"${titleStyle ? ` style="${titleStyle}"` : ''}>${title}</div>
        </div>`;

        /** Right-pointing arrow between steps. */
        const arrowRight = (style = '') =>
            `<div class="arrow-right"${style ? ` style="${style}"` : ''}>➜</div>`;

        /** Down-pointing arrow between phases. */
        const arrowDown = () =>
            `<div class="arrow-down-large">⬇</div>`;

        /**
         * Render a phase container with label, steps, and arrows between them.
         * { label, className, rowStyle, arrowStyle, steps: [{ title, svg(), ...opts }] }
         */
        const renderPhase = ({ label: phaseLabel, className = '', rowStyle = '', arrowStyle = '', layout = 'flow', steps }) => {
            let content = '';

            if (layout === 'grid-3x2') {
                const ga = '<div class="grid-arrow"></div>';
                const gal = '<div class="grid-arrow-left"></div>';
                const row1 = steps.slice(0, 3).map(s => figureCard(s.title, s.svg(), s));
                const row2 = steps.slice(3, 6).map(s => figureCard(s.title, s.svg(), s)).reverse();
                const gridHTML = [
                    row1[0], ga, row1[1], ga, row1[2],
                    '<div class="grid-arrow-down">⬇</div>',
                    row2[0], gal, row2[1], gal, row2[2]
                ].join('\n');

                const extraSteps = steps.slice(6).map((step) =>
                    figureCard(step.title, step.svg(), step)
                ).join('\n');

                content = `<div class="steps-grid-3">${gridHTML}</div>`
                    + (extraSteps ? `<div class="steps-extra-row">${extraSteps}</div>` : '');
            } else if (layout === 'grid-4x2') {
                const ga = '<div class="grid-arrow"></div>';
                const gal = '<div class="grid-arrow-left"></div>';
                // Row 1 double arrow (3<->4): Forward is Right (row1[2]->row1[3]), Feedback is Left (row1[3]->row1[2])
                const gad1 = '<div class="grid-arrow-double"><div class="double-arrow-l arrow-light"></div><div class="double-arrow-r"></div></div>';
                // Row 2 double arrow (7<->8): Forward is Left (row2[1]->row2[0]), Feedback is Right (row2[0]->row2[1])
                const gad2 = '<div class="grid-arrow-double"><div class="double-arrow-l"></div><div class="double-arrow-r arrow-light"></div></div>';

                const row1 = steps.slice(0, 4).map(s => figureCard(s.title, s.svg(), s));
                const row2 = steps.slice(4, 8).map(s => figureCard(s.title, s.svg(), s)).reverse();
                const gridHTML = [
                    row1[0], ga, row1[1], ga, row1[2], gad1, row1[3],
                    '<div class="grid-arrow-down">⬇</div>',
                    row2[0], gad2, row2[1], gal, row2[2], gal, row2[3]
                ].join('\n');

                content = `<div class="steps-grid-4">${gridHTML}</div>`;

            } else {
                content = steps.map((step, i) => {
                    const card = figureCard(step.title, step.svg(), step);
                    return i < steps.length - 1 ? card + arrowRight(arrowStyle) : card;
                }).join('\n');
            }

            return `<div class="phase-container ${className}">
            <div class="phase-label">${phaseLabel}</div>
            <div class="steps-row"${rowStyle ? ` style="${rowStyle}"` : ''}>
                ${content}
            </div>
        </div>`;
        };

        // =====================================================================
        //  PIPELINE DEFINITION
        //  To add a new step: push an object with { title, svg() } into a phase.
        //  To add a new phase: push a new object into this array.
        // =====================================================================

        const pipeline = [
            // ── Unified Pipeline ──
            {
                label: 'Query Bloom Pipeline',
                layout: 'grid-4x2',
                steps: [
                    {
                        title: 'Pattern Pool',
                        svg: () => svgEl(180, 140,
                            label(90, 18, 'Discovered Patterns', { fontSize: '12' })
                            + triplePattern(10, 35, 'Pers', 'Org', 'works')
                            + triplePattern(40, 65, 'Org', 'City', 'locIn')
                            + triplePattern(10, 95, 'Pers', 'Pers', 'knows')
                        )
                    },
                    {
                        title: 'Adjacency Index',
                        svg: () => svgEl(180, 140,
                            `<rect x="10" y="10" width="160" height="120" class="table-rect" rx="4" />`
                            + line(10, 40, 170, 40, '#94a3b8')
                            + line(60, 10, 60, 130, '#94a3b8')
                            + label(35, 30, 'Type', { fontSize: '12' })
                            + label(115, 30, 'Patterns (List)', { fontSize: '12' })
                            + label(35, 60, 'Person')
                            + miniTriple(70, 50)
                            + miniTriple(70, 65, { rectStyle: 'stroke:#d97706;fill:#fef3c7;' })
                            + label(35, 100, 'Org')
                            + miniTriple(70, 95)
                        )
                    },
                    {
                        title: 'DISCOVERED SUBGRAPH',
                        svg: () => svgEl(180, 140,
                            // Triangle edges (no arrowheads)
                            line(73, 55, 38, 95, '#64748b', 1.5)
                            + line(73, 55, 108, 95, '#64748b', 1.5)
                            + line(38, 95, 108, 95, '#64748b', 1.5)
                            // Extension edge (now gray)
                            + line(108, 95, 138, 65, '#64748b', 1.5)

                            // Numbered circles on edges
                            + numCircle(55, 75, 1) // Person -> City
                            + numCircle(73, 95, 2) // City -> Org
                            + numCircle(91, 75, 3) // Person -> Org
                            + numCircle(119, 84, 4) // Org -> Country

                            // Amber nodes
                            + node(53, 35, 40, 20, 'Person', { style: 'stroke:#d97706;fill:#fef3c7;' })
                            + node(18, 95, 40, 20, 'City', { style: 'stroke:#d97706;fill:#fef3c7;' })
                            + node(88, 95, 40, 20, 'Org', { style: 'stroke:#d97706;fill:#fef3c7;' })
                            + node(116, 55, 50, 20, 'Country', { style: 'stroke:#d97706;fill:#fef3c7;' })
                            + label(82, 18, 'DFS Pop & Extend', { fontSize: '12' })
                        )
                    },
                    {
                        title: 'Verified Subgraph',
                        svg: () => svgEl(180, 140,
                            // Green edges (no arrowheads)
                            line(73, 55, 38, 95, '#16a34a', 1.8)
                            + line(73, 55, 108, 95, '#16a34a', 1.8)
                            + line(38, 95, 108, 95, '#16a34a', 1.8)
                            // Green nodes
                            + node(53, 35, 40, 20, 'Person', { style: 'stroke:#16a34a;fill:#dcfce7;', textFill: '#166534' })
                            + node(18, 95, 40, 20, 'City', { style: 'stroke:#16a34a;fill:#dcfce7;', textFill: '#166534' })
                            + node(88, 95, 40, 20, 'Org', { style: 'stroke:#16a34a;fill:#dcfce7;', textFill: '#166534' })
                            // Dashed extension
                            + line(108, 95, 138, 65, '#16a34a', 1.8, 'stroke-dasharray="4,2"')
                            + node(116, 55, 50, 20, 'Country', { style: 'stroke:#16a34a;fill:#dcfce7;', textFill: '#166534' })
                            // Validated Checkmark (no arrow head)
                            + pathEl('M150 115 L160 125 L180 100', { cls: '', style: 'stroke:#16a34a;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;' })
                            + label(90, 18, 'Check Support >= m', { fontSize: '12' })
                        )
                    },
                    {
                        title: 'Extended Subgraph',
                        svg: () => svgEl(180, 140,
                            // Verified subgraph backbone
                            line(73, 55, 38, 95, '#16a34a', 1.8)
                            + line(73, 55, 108, 95, '#16a34a', 1.8)
                            + line(38, 95, 108, 95, '#16a34a', 1.8)
                            + line(108, 95, 138, 65, '#16a34a', 1.8, 'stroke-dasharray="4,2"')
                            // Backbone nodes
                            + node(53, 35, 40, 20, 'Person', { style: 'stroke:#16a34a;fill:#dcfce7;', textFill: '#166534' })
                            + node(18, 95, 40, 20, 'City', { style: 'stroke:#16a34a;fill:#dcfce7;', textFill: '#166534' })
                            + node(88, 95, 40, 20, 'Org', { style: 'stroke:#16a34a;fill:#dcfce7;', textFill: '#166534' })
                            + node(116, 55, 50, 20, 'Country', { style: 'stroke:#16a34a;fill:#dcfce7;', textFill: '#166534' })
                            // Attribute connection (age only, left of Person)
                            + line(53, 45, 46, 45, '#64748b', 1.2)
                            + node(16, 38, 30, 14, 'age', { style: 'fill:#f1f5f9;stroke:#64748b;' })
                            + label(90, 18, 'Attach Attributes & Verify', { fontSize: '12' })
                        )
                    },
                    {
                        title: 'Subgraph Instances',
                        svg: () => svgEl(180, 140,
                            // Stacked card layers
                            `<rect x="22" y="24" width="150" height="82" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" opacity="0.3" />`
                            + `<rect x="18" y="28" width="150" height="82" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" opacity="0.55" />`
                            + `<rect x="14" y="32" width="150" height="90" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />`
                            // Instance edges
                            + line(80, 58, 54, 82, '#2563eb', 1.8)
                            + line(80, 58, 106, 82, '#2563eb', 1.8)
                            + line(106, 82, 126, 62, '#2563eb', 1.8, 'stroke-dasharray="4,2"')
                            // Instance nodes
                            + node(60, 48, 40, 20, 'John', { style: 'stroke:#2563eb;fill:#dbeafe;', textFill: '#1d4ed8', fontSize: '8px' })
                            + node(34, 82, 40, 20, 'NYC', { style: 'stroke:#2563eb;fill:#dbeafe;', textFill: '#1d4ed8', fontSize: '8px' })
                            + node(86, 82, 40, 20, 'IBM', { style: 'stroke:#2563eb;fill:#dbeafe;', textFill: '#1d4ed8', fontSize: '8px' })
                            + node(106, 52, 40, 20, 'USA', { style: 'stroke:#2563eb;fill:#dbeafe;', textFill: '#1d4ed8', fontSize: '8px' })
                            // Sampled attribute from added properties (age only, left of John)
                            + line(60, 58, 44, 58, '#7c3aed', 1.1)
                            + node(18, 52, 26, 12, '25', { style: 'fill:#ede9fe;stroke:#7c3aed;' })
                            + label(90, 16, 'Sample Subgraph Instances', { fontSize: '12' })
                        )
                    },
                    {
                        title: 'Distiller Agent',
                        svg: () => svgEl(180, 140,
                            label(90, 18, 'Distill Text-Sparql Pairs', { fill: '#166534', fontSize: '12' })
                            // YAML document icon
                            + `<rect x="20" y="45" width="50" height="60" class="node-rect" fill="#fff" />`
                            + `<line x1="25" y1="55" x2="65" y2="55" stroke="#ccc" stroke-width="2" />`
                            + `<line x1="25" y1="65" x2="55" y2="65" stroke="#ccc" stroke-width="2" />`
                            + `<line x1="25" y1="75" x2="65" y2="75" stroke="#ccc" stroke-width="2" />`
                            + label(45, 118, 'Prompt', { fontSize: '10', fill: '#334155' })
                            // Arrow
                            + pathEl('M75 75 L105 75', { style: 'marker-end: url(#arrowhead-green); stroke: #16a34a;' })
                            // Bot face
                            + `<rect x="110" y="45" width="50" height="50" rx="4" class="p2-node" style="stroke-width: 2;" />`
                            + `<circle cx="125" cy="60" r="3" fill="#16a34a" />`
                            + `<circle cx="145" cy="60" r="3" fill="#16a34a" />`
                            + `<path d="M125 75 Q135 85 145 75" fill="none" stroke="#16a34a" stroke-width="2" />`
                            + label(135, 108, 'LLM', { fontSize: '10', fill: '#334155' })
                        )
                    },
                    {
                        title: 'Output',
                        svg: () => svgEl(180, 140,
                            label(90, 18, 'Text-SPARQL Pairs', { fill: '#475569', fontSize: '11' })
                            // Stacked card layers
                            + `<rect x="12" y="24" width="170" height="95" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" opacity="0.4" />`
                            + `<rect x="8" y="28" width="170" height="95" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" opacity="0.7" />`
                            + `<rect x="4" y="32" width="170" height="95" rx="8" fill="#fff" stroke="#64748b" stroke-width="1.5" />`

                            // "Natural Language" Label Section
                            + `<rect x="10" y="40" width="158" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />`
                            + `<text x="17" y="51" font-weight="900" fill="#1e40af" font-size="7" style="text-transform:uppercase; letter-spacing:0.5px;">Question</text>`
                            + `<text x="17" y="61" fill="#1e3a8a" font-size="7.5" font-weight="500">How many IBM employees in NYC are</text>`
                            + `<text x="17" y="69" fill="#1e3a8a" font-size="7.5" font-weight="500">older than 30?</text>`

                            // SPARQL "Code Editor" Section
                            + `<rect x="10" y="77" width="158" height="42" rx="4" fill="#1e293b" />`
                            // Window Controls
                            + `<circle cx="17" cy="83" r="1.5" fill="#ff5f56" />`
                            + `<circle cx="22" cy="83" r="1.5" fill="#ffbd2e" />`
                            + `<circle cx="27" cy="83" r="1.5" fill="#27c93f" />`
                            // SPARQL Snippet
                            + `<text x="15" y="93" font-family="monospace" fill="#94a3b8" font-size="7">SELECT (COUNT(?p) AS ?count) WHERE {</text>`
                            + `<text x="15" y="102" font-family="monospace" fill="#38f1ea" font-size="7">  ?p :work :IBM ; :city :NYC . ...</text>`
                            + `<text x="15" y="111" font-family="monospace" fill="#38f1ea" font-size="7">  FILTER (?age > 30) }</text>`
                        )
                    },
                    {
                        title: 'Final Dataset',
                        blockStyle: 'border-style: solid; border-color: #16a34a;',
                        svg: () => svgEl(180, 140,
                            `<rect x="50" y="30" width="80" height="80" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />`
                            + `<text x="90" y="60" text-anchor="middle" font-weight="bold" fill="#14532d" font-size="16">Q / A</text>`
                            + `<text x="90" y="85" text-anchor="middle" fill="#14532d" font-size="10">SPARQL Pairs</text>`
                            + `<path d="M110 100 L120 100 L115 90 Z" fill="#16a34a" />`
                        )
                    }
                ]
            }
        ];

        // =====================================================================
        //  RENDER
        // =====================================================================

        document.getElementById('app').innerHTML =
            pipeline.map((p, i) => {
                const html = renderPhase(p);
                return i < pipeline.length - 1 ? html + arrowDown() : html;
            }).join('\n');
    </script>

</body>

</html>
